/* ---------- asking ---------- */
async function sendChat(text){
  text=(text||"").trim();
  if((!text && !S.chat.images.length) || S.chat.sending || !S.sample) return;
  if(!S.chat.thread) S.chat.thread={messages:[]};
  const scope = chatScope();
  if(scope.key!==S.chat.key){ chatSub(scope.key); }
  const imgs = S.chat.images.splice(0);
  const userMsg = {role:"user", text: text || "(image)", at:Date.now(), by:S.me, images:[]};
  S.chat.thread.messages.push(userMsg);
  S.chat.sending=true; S.chat.streamText=""; renderChat();
  const blobs=[];
  for(const im of imgs){
    blobs.push(im.file);
    try{ const st=await storeFile(im.file, im.file.type); if(st.id) userMsg.images.push(st.id); }catch(e){}
  }
  const history = S.chat.thread.messages.slice(0,-1).slice(-CHAT_HISTORY_TO_MODEL).map(m=>({role:m.role==="user"?"user":"assistant", content:(m.text||"")+(m.images&&m.images.length?" [image attached]":"")}));
  const input = [
    {role:"user", content: CHAT_RULES + "\n\nCONTEXT (current as of this message):\n" + chatContext() + "\n\nI'll ask my questions next."},
    {role:"assistant", content:"Got it. Ask away."},
    ...history,
    {role:"user", content: text || "What do you think of this image, measured against the brief, kit and my current step?"}
  ];
  /* the model needs alternating turns: merge any back-to-back roles */
  const turns=[]; for(const t of input){ const last=turns[turns.length-1]; if(last&&last.role===t.role) last.content+="\n\n"+t.content; else turns.push({...t}); }
  let reply="";
  try{
    const opts={modelTier: S.chat.deep||blobs.length ? "default" : "quick", cache:false,
      onText: ({text:t})=>{ reply=t; S.chat.streamText=t; const el=document.getElementById("chatStream"); if(el){ el.innerHTML=mdLite(splitActions(t).body)||'<span class="spin"></span>'; const log=document.getElementById("chatLog"); if(log) log.scrollTop=log.scrollHeight; } }};
    if(blobs.length) opts.images=blobs;
    const res = await S.sample(turns, opts);
    reply = (res && res.text) || reply;
  }catch(e){
    reply = e && e.code==="rate_limited" ? (e.message||"Claude is busy or this month's AI budget is used up. Try again later.") : "Sorry, that didn't go through. Try again in a moment.";
  }
  const {body, actions} = splitActions(reply);
  S.chat.thread.messages.push({role:"assistant", text: body || "(no answer)", actions, at:Date.now()});
  S.chat.sending=false; S.chat.streamText="";
  const mi = S.chat.thread.messages.length-1; let ran=0;
  actions.forEach((a,k)=>{ if(a.auto===true){ a.auto=false; if(runAction(mi,k,true)) ran++; } });
  saveThread(); renderChat(); if(ran){ render(); toast(ran===1?"Claude made that change.":`Claude made ${ran} changes.`); }
}

/* ---------- doing what the buttons say ---------- */
const ACTION_TYPES = ["split_step","add_step","edit_step","add_note","park","save_card","add_to_brief","replace_text"];
S.chat.undo = {};
function runAction(mi, k, auto){
  const m = S.chat.thread.messages[mi]; const a = m && m.actions && m.actions[k]; if(!a || a.done) return false;
  const {job, pid} = chatScope();
  const cur = job ? curStep(job) : null;
  const needStep = ["split_step","add_step","edit_step","add_note"].includes(a.type);
  const stepTarget = a.type==="replace_text" && String(a.target||"").startsWith("step_");
  const fail = msg=>{ if(auto){ a.failed=msg; } else toast(msg); return false; };
  if((needStep||stepTarget) && (!job || !cur)) return fail("Open the plan or the step this is about, then tap it again.");
  if((needStep||stepTarget) && job.example) return fail("Press “Use this plan” first so changes can be saved.");
  if((["save_card","add_to_brief"].includes(a.type) || (a.type==="replace_text" && a.target==="brief")) && !pid) return fail("Open a project first, then tap it again.");
  const key = mi+":"+k;
  if(needStep||stepTarget) S.chat.undo[key]={kind:"job", snap:clone(job)};
  else if(a.type==="add_to_brief"||(a.type==="replace_text"&&a.target==="brief")) S.chat.undo[key]={kind:"project", snap:clone(projById(pid))};
  const str = v=>String(v||"").slice(0,600);
  let msg = "Done.";
  if(a.type==="split_step"){
    const parts=(Array.isArray(a.parts)?a.parts:[]).map(str).filter(Boolean).slice(0,6); if(parts.length<2) return fail("That split didn't have enough parts.");
    const k0=job.steps.indexOf(cur); const each=Math.max(5, Math.round((+cur.minutes||15)/parts.length));
    const repl=parts.map(t=>({title:t, stage:cur.stage, tag:cur.tag, tool:cur.tool, minutes:each, fidelity:cur.fidelity, goodEnough:"", why:"Split from “"+cur.title+"” to make it easier to start.", prompt:"", check:[]}));
    repl[0].output=cur.output||"";
    job.steps.splice(k0,1,...repl); if(job.pin!=null) job.pin=null;
    putJob(job); msg=`Split into ${parts.length} steps.`;
  } else if(a.type==="add_step"){
    const stage = SPINE_IDX[a.stage]!=null ? a.stage : cur.stage;
    const tool = a.tool && toolByName(a.tool) ? toolByName(a.tool).name : "None";
    const ns={title:str(a.title)||"New step", stage, tag:["you","ai","together"].includes(a.tag)?a.tag:"you", tool, minutes:Math.max(5,Math.min(180,parseInt(a.minutes,10)||15)), fidelity:"mid", goodEnough:str(a.goodEnough), why:"Suggested by Claude.", prompt:str(a.prompt), check:[]};
    job.steps.splice(job.steps.indexOf(cur)+1,0,ns);
    if(job.family){ const pinned=job.pin!=null?job.steps[job.pin]:null; job.steps=sortByStage(job.steps); job.pin=pinned?job.steps.indexOf(pinned):null; }
    putJob(job); msg="Step added.";
  } else if(a.type==="edit_step"){
    const f=a.field;
    if(!["title","goodEnough","prompt","minutes","tool","tag"].includes(f)) return fail("Claude suggested a change the Lab can't make.");
    if(f==="minutes") cur.minutes=Math.max(5,Math.min(180,parseInt(a.value,10)||cur.minutes));
    else if(f==="tool"){ const t=toolByName(a.value); cur.tool = t?t.name:(a.value==="None"?"None":cur.tool); }
    else if(f==="tag"){ if(["you","ai","together"].includes(a.value)) cur.tag=a.value; }
    else cur[f]=str(a.value);
    putJob(job); msg="Step updated.";
  } else if(a.type==="add_note"){
    cur.output = (cur.output?cur.output+"\n":"") + str(a.text); putJob(job); msg="Note added to the step.";
  } else if(a.type==="park"){
    addPark(str(a.text)||"Parked from chat", job&&!job.example?job.id:null, true); S.chat.undo[key]={kind:"park", id:S.parking[0]&&S.parking[0].id}; msg="Parked.";
  } else if(a.type==="save_card"){
    const section=["inspiration","brief","brand"].includes(a.section)?a.section:"inspiration";
    const cid=uid(); putCard({id:cid, projectId:pid, jobId:job&&!job.example?job.id:null, section, tags:[], kind:"note", title:str(a.title)||"From Claude", note:str(a.text), status:"exploring", heart:false, stars:0, notes:[], createdAt:Date.now(), by:S.me}, true); S.chat.undo[key]={kind:"card", id:cid};
    msg=`Saved to ${SECTION_NAME[section]}.`;
  } else if(a.type==="replace_text"){
    const find=String(a.find||""), repl=String(a.replace||"").slice(0,4000);
    const fields={step_prompt:[cur,"prompt"], step_notes:[cur,"output"], step_good_enough:[cur,"goodEnough"], brief:[projById(pid),"brief"]};
    const t=fields[a.target]; if(!t || !t[0]) return fail("Claude pointed at text the Lab can't change.");
    const [obj,field]=t; const before=String(obj[field]||"");
    if(!find || !before.includes(find)) return fail("Couldn't find that exact text to swap. Copy it from the chat instead.");
    obj[field]=before.replace(find, repl);
    if(a.target==="brief"){ obj.briefAt=Date.now(); putProject(obj); } else putJob(job);
    msg="Text swapped.";
  } else if(a.type==="add_to_brief"){
    const p=projById(pid); p.brief=(p.brief?p.brief+"\n\n":"")+str(a.text); p.briefAt=Date.now(); putProject(p); msg="Added to the brief.";
  }
  a.done=true; if(auto) a.auto=true;
  if(!auto){ saveThread(); renderChat(); render(); toast(msg); }
  return true;
}
function undoAction(mi, k){
  const m=S.chat.thread.messages[mi]; const a=m&&m.actions&&m.actions[k]; const u=S.chat.undo[mi+":"+k]; if(!a||!u) return;
  if(u.kind==="job") putJob(u.snap);
  else if(u.kind==="project"){ putProject(u.snap); }
  else if(u.kind==="park"){ const pk=S.parking.find(x=>x.id===u.id); if(pk){ pk.done=true; pk.trashedAt=Date.now(); const {id,...body}=pk; save("parking/"+id, body); S.parking=S.parking.filter(x=>x.id!==u.id); } }
  else if(u.kind==="card"){ const c=S.cards.find(x=>x.id===u.id); if(c){ c.trashedAt=Date.now(); putCard(c,true); S.cards=S.cards.filter(x=>x.id!==u.id); } }
  delete S.chat.undo[mi+":"+k]; a.done=false; a.undone=true; a.auto=false;
  saveThread(); renderChat(); render(); toast("Undone.");
}

/* keep the panel in step with the screen */
window.addEventListener("hashchange", ()=>{ if(S.chat.open){ const k=chatScope().key; if(k!==S.chat.key) chatSub(k); renderChat(); } });
document.addEventListener("keydown", e=>{ const pnl=document.getElementById("chatPanel"); if(e.key==="Escape" && S.chat.open && pnl && pnl.contains(document.activeElement)){ toggleChat(false); } });
setTimeout(()=>chatShell(), 0);

boot();
</script>
