        <div class="stack" style="gap:4px;padding:14px 16px 16px"><div class="row" style="gap:6px;flex-wrap:nowrap"><h3 style="flex:1;min-width:0" class="ptitle">${esc(p.name)}</h3><button class="icon-btn sm hover-actions" data-projmenu="${p.id}" aria-label="More for ${esc(p.name)}" data-stop>⋯</button></div>

      <select data-assign="${j.id}" aria-label="Move to project"><option value="">Move to project…</option>${S.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select></div>`).join("")}</div>`:""}

function wallView(pid){
  const p = projById(pid);
  if(!p) return S.loaded.jobs?`<div class="empty">That project isn't here. <a href="#projects">All projects</a></div>`:`${(S.waiting=true,"")}<div class="empty"><span class="spin"></span> Loading…</div>`;
  const all = cardsOf(pid);
  const sec = S.wallSection[pid]||"all";
  let cards = all.filter(c=>sec==="all"||c.section===sec);
  const tagSet = [...new Set(cards.flatMap(c=>c.tags||[]))];
  const tag = S.wallTag[pid]; if(tag) cards = cards.filter(c=>(c.tags||[]).includes(tag));
  const parkedN = cards.filter(c=>c.status==="parked").length;
  if(!S.showParked) cards = cards.filter(c=>c.status!=="parked");
  const order = {chosen:0, shortlisted:1, starred:2, exploring:3, parked:4};
  cards.sort((a,b)=>(order[a.status]-order[b.status]) || (b.createdAt-a.createdAt));
  const tasks = S.jobs.filter(j=>j.projectId===pid);
  return `<div class="stack" style="gap:20px">
    <a href="#projects" class="btn ghost small" style="align-self:flex-start">← Projects</a>
    <div class="row" style="align-items:flex-end"><div class="stack" style="gap:6px;flex:1 1 320px"><span class="eyebrow">Project wall</span><h1>${esc(p.name)}</h1></div>
      <div class="actions"><button class="btn" data-act="renameProj">Rename</button><button class="btn primary big" data-act="addCard">+ Add to wall</button></div></div>
    <div class="row" style="gap:10px">${tasks.map(j=>`<a class="chip" href="#job-${j.id}" style="text-decoration:none;padding:6px 12px;font-size:13px">${esc(j.title)}${j.status==="done"?" ✓":""}</a>`).join("")}
      <button class="btn small" data-act="taskHere">+ Plan a task here</button></div>
    <div class="tabs" role="tablist">
      <button class="tab ${sec==="all"?"on":""}" data-sec="all">All <b>${all.length}</b></button>
      ${SECTIONS.map(s=>{ const n=all.filter(c=>c.section===s.key).length; return `<button class="tab ${sec===s.key?"on":""}" data-sec="${s.key}">${s.name} <b>${n}</b></button>`; }).join("")}
    </div>
    ${tagSet.length?`<div class="row" style="gap:6px"><span class="muted" style="font-size:13px">Filter:</span>${tagSet.map(t=>`<button class="tagchip ${tag===t?"on":""}" data-tagf="${esc(t)}">${esc(t)}</button>`).join("")}${tag?`<button class="btn small ghost" data-tagf="">Clear</button>`:""}</div>`:""}
    <div class="row" style="gap:10px"><span class="muted" style="font-size:13px">${cards.length} showing${parkedN&&!S.showParked?` · ${parkedN} parked hidden`:""}</span>${parkedN?`<button class="btn small ghost" data-act="toggleParked">${S.showParked?"Hide":"Show"} parked</button>`:""}<span class="spacer"></span>
      ${S.compare.length?`<a class="btn small primary" href="#compare">Compare ${S.compare.length}</a><button class="btn small ghost" data-act="clearCompare">Clear</button>`:`<span class="muted" style="font-size:13px">Tick up to 4 cards to compare</span>`}</div>
    ${cards.length?`<div class="masonry">${cards.map(c=>cardTile(c,false)).join("")}</div>`
      :`<div class="empty dropzone" data-act="addCard">${all.length?"Nothing here with these filters.":"Drop, paste or add screenshots, links and files. Everything for "+esc(p.name)+" lives here."}</div>`}
  </div>`;
}
function cardTile(c, showProj){
  const sel = S.compare.includes(c.id);
  const img = (c.kind==="image" && (c.thumb||c.blob)) || (c.kind==="link" && c.thumb);
  let face;
  if(img) face = `<button class="g-face" data-lb="${c.id}" aria-label="View ${esc(c.title)}"><img src="${esc(c.thumb||imgSrc(c))}" alt="${esc(c.title)}" loading="lazy"></button>`;
  else if(c.kind==="link") face = `<a class="g-face linkface" href="#card-${c.id}" style="cursor:pointer;text-decoration:none;color:inherit"><div class="ld"><span class="meta">${esc(domainOf(c.url))}</span><b>${esc(c.title||c.url)}</b></div></a>`;
  else if(c.kind==="note") face = `<a class="g-face" href="#card-${c.id}" style="cursor:pointer;text-decoration:none;color:inherit"><div class="noteface">${esc(c.note).slice(0,280)}</div></a>`;
  else face = `<a class="g-face" href="#card-${c.id}" style="cursor:pointer;text-decoration:none;color:inherit"><div class="noteface"><b>${esc(c.title)}</b><br><span class="muted">${esc(typeLabel(c.fileType))} file</span></div></a>`;
  const showCap = (c.titleManual && c.kind==="image") || showProj || c.status==="chosen" || c.status==="shortlisted";
  return `<div class="gtile ${sel?"sel":""}" data-tile="${c.id}">
    ${face}${c.heart?`<span class="g-heart" aria-hidden="true">♥</span>`:""}
    ${showCap?`<div class="g-cap"><div class="row" style="gap:6px">${c.status==="chosen"||c.status==="shortlisted"?`<span class="st ${c.status}">${CSTATUS[c.status]}</span>`:""}${showProj?`<span class="meta">${esc(projName(c.projectId))}</span>`:""}${c.titleManual&&c.kind==="image"?`<span class="support" style="color:var(--ink)">${esc(c.title)}</span>`:""}</div></div>`:""}
    <div class="g-over"><button class="icon-btn sm ${c.heart?"on":""}" data-heart="${c.id}" aria-label="${c.heart?"Remove favorite":"Favorite"}" aria-pressed="${!!c.heart}">♥</button><button class="icon-btn sm ${sel?"on":""}" data-cmpt="${c.id}" aria-label="${sel?"Remove from compare":"Add to compare"}" aria-pressed="${sel}" title="Compare">⧉</button><span style="flex:1"></span><button class="icon-btn sm" data-cardmenu="${c.id}" aria-label="More for this item">⋯</button></div>
  </div>`;
}

function cardView(id){
  const c = S.cards.find(x=>x.id===id);
  if(!c) return S.loaded.jobs?`<div class="empty">That card isn't here. <a href="#projects">Projects</a></div>`:`${(S.waiting=true,"")}<div class="empty"><span class="spin"></span> Loading…</div>`;
  const back = /^(project-|board|compare|focus-|job-)/.test(S.lastHash||"") ? S.lastHash : (c.projectId?"project-"+c.projectId:"board");
  const sugg = [...new Set([...(SECTION_TAGS[c.section]||[]), ...S.cards.flatMap(x=>x.tags||[])])].filter(t=>!(c.tags||[]).includes(t)).slice(0,14);
  const job = c.jobId? getJob(c.jobId): null;
  return `<div class="stack" style="gap:18px">
    <a href="#${back}" class="btn ghost small" style="align-self:flex-start">← Back</a>
    <div class="cardgrid">
      <div class="stack">
        ${c.kind==="image"?`<div class="bigimg"><img src="${esc(imgSrc(c))}" alt="${esc(c.title)}" onerror="this.src='${esc(c.thumb||"")}'"></div>`:""}
        ${c.kind==="link"?`<div class="card stack">${c.thumb?`<img src="${esc(c.thumb)}" alt="" style="width:100%;border-radius:10px">`:""}<a href="${esc(c.url)}" target="_blank" rel="noopener" class="btn">Open ${esc(domainOf(c.url))} ↗</a></div>`:""}
        ${c.kind==="file"&&c.blob?`<a class="btn" href="${esc(imgSrc(c))}" target="_blank" rel="noopener">Open file ↗</a>`:""}
        ${c.cleanCopy?`<p class="muted" style="font-size:13px">Stored as a clean copy: the original was refused by the upload check.</p>`:""}
      </div>
      <div class="stack" style="gap:16px">
        <div><label for="c-title">Title</label><input type="text" id="c-title" value="${esc(c.title)}"></div>
        <div class="row" style="gap:6px">${Object.keys(CSTATUS).map(k=>`<button class="btn small ${c.status===k?"primary":""}" data-cst="${k}">${CSTATUS[k]}</button>`).join("")}</div>
        <div class="row" style="gap:10px"><button class="heart big ${c.heart?"on":""}" data-heart="${c.id}" aria-pressed="${!!c.heart}">♥ ${c.heart?"Favorite":"Make it a favorite"}</button>${c.kind==="image"?`<button class="btn small" data-lb="${c.id}">View large</button>`:""}</div>
        <div class="two" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div><label for="c-proj">Project</label><select id="c-proj">${S.projects.map(p=>`<option value="${p.id}" ${p.id===c.projectId?"selected":""}>${esc(p.name)}</option>`).join("")}</select></div>
          <div><label for="c-sec">Section</label><select id="c-sec">${SECTIONS.map(s=>`<option value="${s.key}" ${s.key===c.section?"selected":""}>${s.name}</option>`).join("")}</select></div>
        </div>
        <div><span style="font-weight:700;font-size:14px;display:block;margin-bottom:6px">Tags</span>
          <div class="row" style="gap:6px">${(c.tags||[]).map(t=>`<button class="tagchip on" data-untag="${esc(t)}" title="Remove">${esc(t)} ×</button>`).join("")}
          ${sugg.map(t=>`<button class="tagchip" data-addtag="${esc(t)}">+ ${esc(t)}</button>`).join("")}</div>
          <form id="tagForm" class="row" style="gap:8px;margin-top:8px"><input type="text" id="newTag" placeholder="New tag" style="max-width:220px" aria-label="New tag"><button class="btn small" type="submit">Add tag</button></form></div>
        ${c.kind==="link"?`<div><label for="c-url">Link</label><input type="text" id="c-url" value="${esc(c.url)}"></div>`:""}
        <div><label for="c-note">Why you saved it</label><textarea id="c-note" placeholder="e.g. love the sticky nav and the oversized type">${esc(c.note)}</textarea></div>
        <div class="row"><button class="btn primary" data-act="saveCard">Save changes</button><span class="spacer"></span><button class="btn" data-act="trashCard" style="color:var(--warn)">🗑 Delete</button></div>
        <div class="stack" style="gap:8px"><span class="eyebrow">Notes</span>
          ${(c.notes||[]).map(n=>`<div class="note-item">${esc(n.text)}<span class="muted" style="font-size:12px"> · ${new Date(n.at).toLocaleDateString()}</span></div>`).join("")||`<p class="muted" style="font-size:14px">No notes yet.</p>`}
          <form id="noteForm" class="task-input"><input type="text" id="noteText" placeholder="Add a note" aria-label="Note"><button class="btn small" type="submit">Add</button></form></div>
        <p class="muted" style="font-size:13px">Saved ${new Date(c.createdAt).toLocaleDateString()}${job?` during “<a href="#job-${job.id}">${esc(job.title)}</a>”`:""}${c.stage?`, ${stageName(c.stage)} phase`:""}.${job&&(c.stepSids||[]).length?` Attached to: ${c.stepSids.map(sid=>stepBySid(job,sid)).filter(Boolean).map(st=>`“${esc(st.title)}”`).join(", ")}.`:""}${c.role?` ${c.role==="ref"?"Reference":"Your own work"}.`:""}</p>

function compareView(){
  const cs = S.compare.map(id=>S.cards.find(c=>c.id===id)).filter(Boolean);
  if(!cs.length) return `<div class="empty">Nothing to compare. Tick “Compare” on up to 4 cards. <a href="#projects">Projects</a></div>`;
  return `<div class="stack" style="gap:18px">
    <div class="row"><button class="btn ghost small" data-act="backFromCompare">← Back</button><h2 style="flex:1">Compare</h2><button class="btn small" data-act="clearCompare">Clear</button></div>
    <div class="cmpgrid" style="grid-template-columns:repeat(${Math.min(cs.length,cs.length===4?2:cs.length)},1fr)">
      ${cs.map(c=>`<div class="card stack" style="gap:10px;padding:12px">
        ${c.kind==="image"||c.thumb?`<img src="${esc(c.kind==="image"?imgSrc(c):c.thumb)}" alt="${esc(c.title)}" style="width:100%;border-radius:10px;max-height:60vh;object-fit:contain;background:var(--paper)">`:`<div class="noteface">${esc(c.note||c.url)}</div>`}
        <div class="row"><b style="flex:1">${esc(c.title)}</b><span class="chip">${esc(projName(c.projectId))}</span></div>
        <div class="row" style="gap:6px">${["starred","shortlisted","chosen","parked"].map(k=>`<button class="btn small ${c.status===k?"primary":""}" data-cst2="${c.id}" data-k="${k}">${CSTATUS[k]}</button>`).join("")}</div>
      </div>`).join("")}
    </div></div>`;
}

function boardView(){
  const f = S.board;
  let cs = S.cards.filter(c=>f.allSections || c.section==="inspiration");
  const tagSet = [...new Set(cs.flatMap(c=>c.tags||[]))].sort();
  if(f.tag) cs = cs.filter(c=>(c.tags||[]).includes(f.tag));
  if(f.project) cs = cs.filter(c=>c.projectId===f.project);
  if(f.hearts) cs = cs.filter(c=>c.heart);
  cs = cs.filter(c=>c.status!=="parked");
  cs.sort(f.sort==="top" ? (a,b)=>(b.heart?1:0)-(a.heart?1:0) || b.createdAt-a.createdAt : (a,b)=>b.createdAt-a.createdAt);
  return `<div class="stack" style="gap:var(--s4)">
    <div class="page-head"><span class="eyebrow">Every project, one board</span><h1>Library</h1>
    <p class="support">Everything you've saved as inspiration, across projects. Click an image to see it large; use ← and → to flip through.</p></div>
    <div class="row" style="gap:10px">
      <select id="bTag" aria-label="Tag" style="width:auto"><option value="">All tags</option>${tagSet.map(t=>`<option ${f.tag===t?"selected":""}>${esc(t)}</option>`).join("")}</select>
      <select id="bProj" aria-label="Project" style="width:auto"><option value="">All projects</option>${S.projects.map(p=>`<option value="${p.id}" ${f.project===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select>
      <label style="margin:0;font-weight:700;display:flex;gap:6px;align-items:center"><input type="checkbox" id="bHearts" ${f.hearts?"checked":""}> ♥ only</label>
      <label style="margin:0;font-weight:400;display:flex;gap:6px;align-items:center"><input type="checkbox" id="bAll" ${f.allSections?"checked":""}> Include your own work and files</label>
      <span class="spacer"></span>
      <select id="bSort" aria-label="Sort" style="width:auto"><option value="new" ${f.sort!=="top"?"selected":""}>Newest</option><option value="top" ${f.sort==="top"?"selected":""}>Favorites first</option></select>
      ${S.compare.length?`<a class="btn small primary" href="#compare">Compare ${S.compare.length}</a><button class="btn small ghost" data-act="clearCompare">Clear</button>`:""}
    </div>
    ${cs.length?`<div class="gallery">${cs.map(c=>cardTile(c,!f.project)).join("")}</div>`:`<div class="empty">${S.cards.length?"Nothing matches these filters.":"Nothing saved yet. Save inspiration from any project, or drop it in during an Explore step."}</div>`}
  </div>`;
}
function openAddCard(opts){
  opts = opts||{};
  const pid = opts.projectId || null;
  const sec = opts.section || "inspiration";
  let picked = new Set(opts.tags||[]);
  const tagRow = s => (SECTION_TAGS[s]||[]).map(t=>`<button type="button" class="tagchip ${picked.has(t)?"on":""}" data-pt="${esc(t)}">${esc(t)}</button>`).join("");
  modal(`<h2>Add to the wall</h2>
    <form id="addForm" class="stack" style="gap:12px">
      ${pid?"":`<div><label for="a-proj">Project</label><select id="a-proj">${S.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}<option value="__new">+ New project…</option></select>
        <input type="text" id="a-newproj" placeholder="Project name" style="margin-top:8px;display:${S.projects.length?"none":"block"}"></div>`}
      <div class="dropzone" id="a-drop" tabindex="0">${opts.files&&opts.files.length?`${opts.files.length} file${opts.files.length>1?"s":""} ready`:"Drop images, PDFs or Word files here, paste (⌘V), or click to choose"}</div>
      <input type="file" id="a-file" accept="image/*,.pdf,.doc,.docx,.txt,.md" multiple style="display:none">
      <div><label for="a-url">Or a link <span class="hint">website, Dribbble shot, article</span></label><input type="text" id="a-url" placeholder="https://" value="${esc(opts.url||"")}"></div>
      <div><label for="a-title">Title <span class="hint">optional</span></label><input type="text" id="a-title"></div>
      <div><label for="a-sec">Section</label><select id="a-sec">${SECTIONS.map(s=>`<option value="${s.key}" ${s.key===sec?"selected":""}>${s.name}</option>`).join("")}</select></div>
      <div class="row" style="gap:6px" id="a-tags">${tagRow(sec)}</div>
      <div><label for="a-note">Note or pasted text <span class="hint">why you saved it, or paste a brief, copy or notes</span></label><textarea id="a-note" style="min-height:80px" placeholder="e.g. great product grid">${esc(opts.text||"")}</textarea></div>
      <div class="row"><button class="btn primary" type="submit" id="a-save">Save</button><button class="btn ghost" type="button" id="a-cancel">Cancel</button></div>
    </form>`, {"a-cancel":closeLayer});
  let files = opts.files ? [...opts.files] : [];
  const drop=$("#a-drop"), fi=$("#a-file");
  const setFiles = fs=>{ const all=[...fs]; files=all.filter(f=>fileType(f)); const skipped=all.length-files.length;
    drop.textContent = (files.length? `${files.length} file${files.length>1?"s":""} ready` : "Drop images, PDFs or Word files here, paste (⌘V), or click to choose") + (skipped?` · ${skipped} skipped (only images, PDF, Word and text files)`:""); };
  drop.onclick=()=>fi.click(); drop.onkeydown=e=>{ if(e.key==="Enter") fi.click(); };
  fi.onchange=()=>setFiles(fi.files);
  drop.ondragover=e=>{ e.preventDefault(); drop.classList.add("over"); }; drop.ondragleave=()=>drop.classList.remove("over");
  drop.ondrop=e=>{ e.preventDefault(); drop.classList.remove("over"); setFiles(e.dataTransfer.files); };
  S.addPaste = fs=>setFiles(fs);
  const ap=$("#a-proj"); if(ap) ap.onchange=()=>{ $("#a-newproj").style.display = ap.value==="__new"?"block":"none"; };
  $("#a-sec").onchange=()=>{ picked=new Set(); $("#a-tags").innerHTML=tagRow($("#a-sec").value); };
  $("#a-tags").onclick=e=>{ const b=e.target.closest("[data-pt]"); if(!b) return; const t=b.dataset.pt; picked.has(t)?picked.delete(t):picked.add(t); b.classList.toggle("on"); };
  $("#addForm").onsubmit=async e=>{
    e.preventDefault();
    let projectId = pid;
    if(!projectId){ const v=ap?ap.value:"__new"; if(v==="__new"||!v){ const n=$("#a-newproj").value.trim(); if(!n){ $("#a-newproj").style.display="block"; $("#a-newproj").focus(); return; } projectId=newProject(n).id; } else projectId=v; }
    const url=$("#a-url").value.trim(), title=$("#a-title").value.trim(), note=$("#a-note").value.trim(), section=$("#a-sec").value, tags=[...picked];
    if(!files.length && !url && !note){ toast("Add a file, a link or some text."); return; }
    const btn=$("#a-save"); btn.disabled=true; btn.innerHTML=`<span class="spin"></span> Saving…`;
    const meta={projectId, section, tags, note, title, jobId:opts.jobId, stage:opts.stage};
    let saved=0;
    if(url && !/^https?:\/\//i.test(url)){ toast("Links need to start with http:// or https://"); btn.disabled=false; btn.textContent="Save"; return; }
    if(url){ /* a link card; the first image, if any, becomes its screenshot */
      let thumb="", blob=null, w=0, h=0, clean=false;
      if(files[0]){ const t=await makeThumb(files[0]); thumb=t.thumb; w=t.w; h=t.h; const st=await storeFile(files[0]); blob=st.id; clean=!!st.clean; files=files.slice(1); }
      putCard({id:uid(), projectId, jobId:opts.jobId||null, section, tags, kind:"link", title:title||domainOf(url), note, url, blob, thumb, w, h, cleanCopy:clean, status:"exploring", heart:false, stars:0, notes:[], stage:opts.stage||null, createdAt:Date.now(), by:S.me}, true); saved++;
    }
    for(const f of files){ const c=await cardFromFile(f, {...meta, title: files.length===1?title:""}); if(c) saved++; }
    if(!url && !files.length && note){ putCard({id:uid(), projectId, jobId:opts.jobId||null, section, tags, kind:"note", title:title||note.split("\n")[0].slice(0,80)||"Note", note, status:"exploring", heart:false, stars:0, notes:[], stage:opts.stage||null, createdAt:Date.now(), by:S.me}, true); saved++; }
    S.addPaste=null; closeLayer();
    if(saved){ toast(`Saved ${saved} to ${SECTION_NAME[section]} in ${projName(projectId)}.`); }
    const tabFor = {brief:"brief", inspiration:"inspiration", brand:"kit"}[section] || "work";
    S.projTab[projectId]=tabFor; if(tabFor==="work") S.wallSection[projectId]=section;
    if(view().v==="focus"){ render(); } else if(view().v!=="project" || view().id!==projectId) go("project-"+projectId); else render();
  };
}

/* quick save from focus mode: files go straight to the right section */
async function quickSave(j, files){
  const s = curStep(j);
  if(j.example){ toast("Press “Use this plan” first so there's a project to save into."); return; }
  if(!j.projectId){ toast("Pick a project for this task first."); return; }
  const section = STAGE_TO_SECTION[s&&s.stage] || "inspiration";
  toast("Saving…");
  let n=0; for(const f of files){ const c=await cardFromFile(f, {projectId:j.projectId, jobId:j.id, section, stage:s&&s.stage}); if(c) n++; }
  if(n){ toast(`Saved ${n} to ${SECTION_NAME[section]}. Tag it later on the wall.`); render(); }
}
function saveToWallBlock(j, s){
  if(j.example) return `<div class="savewall muted">Saving to a wall works once you press “Use this plan”.</div>`;

/* paste screenshots straight in */
document.addEventListener("paste", e=>{
  const files=[...(e.clipboardData&&e.clipboardData.files||[])].filter(f=>/^image\//.test(f.type));
  const r=view();
  if(S.addPaste && files.length){ e.preventDefault(); S.addPaste(files); return; }
  const tag=(e.target.tagName||"").toLowerCase(); if(["input","textarea"].includes(tag) || (e.target.isContentEditable)) return;
  if(!files.length){ const txt=(e.clipboardData.getData("text")||"").trim(); if(!txt) return;
    const pid = r.v==="project" ? r.id : r.v==="focus" ? (getJob(r.id)||{}).projectId : null;
    if(!["project","board","focus"].includes(r.v)) return;
    e.preventDefault();
    if(/^https?:\/\/\S+$/.test(txt)){ if(r.v==="focus"){ const j=getJob(r.id); if(j&&j.projectId&&!j.example){ attachLink(j, focusStep(j), txt); return; } } openAddCard({projectId:pid, url:txt, stay:true}); return; }
    if(r.v==="project" && S.projTab[r.id]==="brief"){ const ta=document.getElementById("briefText"); if(ta){ ta.value = ta.value ? ta.value+"\n\n"+txt : txt; saveBrief(r.id); } return; }
    const tab = r.v==="project" ? S.projTab[r.id] : null;
    openAddCard({projectId:pid, text:txt, stay:true, section: tab==="kit"?"brand": (txt.length>300 || tab==="brief") ? "brief" : "inspiration"});
    return; }
  e.preventDefault();
  if(r.v==="focus"){ const j=getJob(r.id); if(j && j.projectId && !j.example){ const side=document.getElementById("sideWrap"); if(side && side.contains(document.activeElement) && S.drawerTab==="insp") drawerSave(j, files); else attachToStep(j, focusStep(j), files); } else toast("Put this plan in a project first."); return; }
  if(r.v==="project"||r.v==="board"||r.v==="projects"){ const tab=r.v==="project"?S.projTab[r.id]:null; openAddCard({projectId:r.v==="project"?r.id:null, files, stay:true, section: tab==="kit"?"brand":tab==="work"?(S.wallSection[r.id]&&S.wallSection[r.id]!=="all"?S.wallSection[r.id]:"designs"):"inspiration"}); }
});

const KIT_FIELDS_EMPTY = ()=>({status:"draft", palette:[], type:{display:"", body:"", notes:""}, mood:[], imageStyle:"", voice:"", dos:"", donts:"", references:[], updatedAt:0});
function kitOf(pid){ return S.kits[pid] || null; }
function kitReady(k){ return k && (k.palette.length || k.mood.length || k.imageStyle || k.voice || (k.type&&k.type.display)); }
function putKit(pid, k){ k.updatedAt=Date.now(); S.kits[pid]=k; save("kits/"+pid, JSON.parse(JSON.stringify(k))); }

/* ---------- kit as text for each tool ---------- */
function kitText(pid, toolName){
  const k = kitOf(pid); if(!kitReady(k)) return "";
  const p = projName(pid);
  const pal = k.palette.map(c=>`${c.hex}${c.name?" "+c.name:""}${c.role?" ("+c.role+")":""}`).join(", ");
  const refs = (k.references||[]).map(r=>{ const c=S.cards.find(x=>x.id===r.cardId); return c? `- ${c.title}${c.url?" ("+c.url+")":""}: take ${r.take||"the overall feel"}` : null; }).filter(Boolean);
  const isImage = /gemini|image|midjourney|firefly/i.test(toolName||"");
  if(isImage){
    const dot=t=>t&&!/[.!?]$/.test(t.trim())?t.trim()+".":t;
    return [`Visual style for ${p}:`, dot(k.imageStyle), k.mood.length?`Mood: ${k.mood.join(", ")}.`:"", pal?`Colour palette: ${pal}.`:"", k.donts?`Avoid: ${k.donts.split("\n").filter(Boolean).join("; ")}.`:"", "Original work only; do not copy any existing brand or design."].filter(Boolean).join(" ");
  }
  return [`PROJECT KIT: ${p}`,
    pal&&`Palette: ${pal}`,
    (k.type.display||k.type.body)&&`Type: ${[k.type.display&&"display "+k.type.display, k.type.body&&"body "+k.type.body].filter(Boolean).join(", ")}${k.type.notes?". "+k.type.notes:""}`,
    k.mood.length&&`Mood: ${k.mood.join(", ")}`,
    k.imageStyle&&`Image style: ${k.imageStyle}`,
    k.voice&&`Voice and tone: ${k.voice}`,
    k.dos&&`Do: ${k.dos.split("\n").filter(Boolean).join("; ")}`,
    k.donts&&`Don't: ${k.donts.split("\n").filter(Boolean).join("; ")}`,
    refs.length&&`References (take the quality named, never copy):\n${refs.join("\n")}`
  ].filter(Boolean).join("\n");
}
function promptWithKit(j, s){
  const base = fillPrompt(j, s).text;
  if(!j.projectId || s.tag==="you") return base;
  const parts=[base];
  const blk=decisionBlock(j,s); if(blk.text) parts.push(blk.text);
  const k=kitOf(j.projectId); if(k && k.status==="locked"){ const kt=kitText(j.projectId, s.tool); if(kt) parts.push(kt); }
  return parts.join("\n\n");
}
function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }
async function pullColors(cards){
  const buckets={};
  for(const c of cards.slice(0,12)){ if(!c.thumb) continue;
    try{ const im=await loadImg(c.thumb); const cv=document.createElement("canvas"); cv.width=48; cv.height=48; const x=cv.getContext("2d"); x.drawImage(im,0,0,48,48);
      const d=x.getImageData(0,0,48,48).data;
      for(let i=0;i<d.length;i+=4){ const r=d[i]>>4, g=d[i+1]>>4, b=d[i+2]>>4; const key=(r<<8)|(g<<4)|b; const bk=buckets[key]=buckets[key]||{n:0,r:0,g:0,b:0}; bk.n++; bk.r+=d[i]; bk.g+=d[i+1]; bk.b+=d[i+2]; }
    }catch(e){} }
  const list=Object.values(buckets).map(b=>({n:b.n, r:b.r/b.n, g:b.g/b.n, b:b.b/b.n})).sort((a,b)=>b.n-a.n);
  const out=[]; for(const c of list){ if(out.every(o=>Math.hypot(o.r-c.r,o.g-c.g,o.b-c.b)>60)) out.push(c); if(out.length>=6) break; }
  return out.map(c=>"#"+[c.r,c.g,c.b].map(v=>Math.round(v).toString(16).padStart(2,"0")).join("").toUpperCase());
}

  const imgs=[...new Map(list.flatMap(x=>x.atts.filter(c=>c.kind==="image"&&(c.thumb||c.blob))).map(c=>[c.id,c])).values()];
  const card=x=>`<div class="ws-item"><div class="wi-head"><span class="ph-status ${x.s.status==="done"?"done":x.s===curStep(x.j)?"cur":""}">${x.s.status==="done"?"Done":x.s.status==="skipped"?"Skipped":x.s===curStep(x.j)?"In progress":"Draft"}</span><b style="flex:1;min-width:0">${esc(x.s.title)}</b><span class="meta">${st.mode==="phase"?"":esc(stageName(x.s.stage))}${js.length>1?(st.mode==="phase"?"":" · ")+esc(x.j.title):""}</span><button class="btn small hover-actions" data-worksrc="${x.j.id}|${x.s.sid}">Open</button></div>
    ${x.text?`<div class="wi-sum">${esc(x.text.slice(0,400))}</div>`:""}${x.atts.length?`<div class="ws-thumbs">${x.atts.map(attThumb).join("")}</div>`:""}

${((projById(pid)||{}).brief||"none given").slice(0,8000)}
Plans:
${brief||"none given"}
Her references (title, tags, why she saved it, rating):
${pool.map((c,i)=>`${i+1}. ${c.title} | tags: ${(c.tags||[]).join(", ")||"-"} | why: ${c.note||"-"} | ${c.heart?"favorite ":""}${c.stars?c.stars+" stars":""}`).join("\n")}

      if(Array.isArray(v.palette)&&v.palette.length) k.palette=v.palette.slice(0,8).map(c=>({hex:/^#[0-9a-f]{6}$/i.test(c.hex)?c.hex.toUpperCase():"#888888", name:String(c.name||""), role:String(c.role||"")}));

const WS_TAGS = {P:1,BR:1,H1:"H2",H2:1,H3:1,H4:"H3",B:1,STRONG:"B",I:1,EM:"I",U:1,UL:1,OL:1,LI:1,A:1,BLOCKQUOTE:1,CODE:1,PRE:1,IMG:1,MARK:1,DIV:"P",HR:1};
function cleanHtml(html){
  const tpl=document.createElement("template"); tpl.innerHTML=String(html||"");
  const out=document.createElement("div");
  const walk=(src, dst)=>{
    for(const n of [...src.childNodes]){
      if(n.nodeType===3){ dst.appendChild(document.createTextNode(n.nodeValue)); continue; }
      if(n.nodeType!==1) continue;
      const tag=n.tagName; let map=WS_TAGS[tag];
      if(/^(SCRIPT|STYLE|META|LINK|TITLE|IFRAME|OBJECT|SVG|BUTTON|INPUT|SELECT|TEXTAREA|NOSCRIPT)$/.test(tag)) continue;
      if(!map){ walk(n, dst); continue; }
      const name = map===1? tag : map;
      if(name==="IMG"){ const src=n.getAttribute("src")||""; if(/^\/_blob\/[a-f0-9]{32}$/.test(src) || /^local/.test(n.dataset.blob||"")){ const im=document.createElement("img"); im.src=src; im.alt=(n.getAttribute("alt")||"").slice(0,200); if(n.dataset.blob) im.dataset.blob=n.dataset.blob; dst.appendChild(im); } continue; }
      const el=document.createElement(name);
      if(name==="A"){ const h=n.getAttribute("href")||""; if(/^(https?:|mailto:)/i.test(h)){ el.href=h; el.target="_blank"; el.rel="noopener"; } else { walk(n, dst); continue; } }
      if(name==="UL" && n.classList.contains("check")) el.className="check";
      if(name==="LI" && n.classList.contains("on")) el.className="on";
      if(name==="MARK"){ el.className="dec"; if(n.dataset.dec) el.dataset.dec=n.dataset.dec.slice(0,40); }
      walk(n, el); dst.appendChild(el);
    }
  };
  walk(tpl.content, out);

}

function mdToHtml(t){
  const lines=String(t).split("\n"); let html="", list=null;
  const inl=x=>esc(x).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*]+)\*/g,"$1<i>$2</i>").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/(https?:\/\/[^\s<]+)/g,u=>`<a href="${u}">${u}</a>`);
  const close=()=>{ if(list){ html+=`</${list}>`; list=null; } };
  for(const ln of lines){
    let m;
    if((m=ln.match(/^\s*#{1,2}\s+(.*)/))){ close(); html+=`<h2>${inl(m[1])}</h2>`; continue; }
    if((m=ln.match(/^\s*#{3,6}\s+(.*)/))){ close(); html+=`<h3>${inl(m[1])}</h3>`; continue; }
    if((m=ln.match(/^\s*[-*•]\s+\[( |x)\]\s+(.*)/i))){ if(list!=="ul class=\"check\""){ close(); html+='<ul class="check">'; list='ul class="check"'; } html+=`<li${m[1].trim()?' class="on"':""}>${inl(m[2])}</li>`; continue; }
    if((m=ln.match(/^\s*[-*•]\s+(.*)/))){ if(list!=="ul"){ close(); html+="<ul>"; list="ul"; } html+=`<li>${inl(m[1])}</li>`; continue; }
    if((m=ln.match(/^\s*\d+[.)]\s+(.*)/))){ if(list!=="ol"){ close(); html+="<ol>"; list="ol"; } html+=`<li>${inl(m[1])}</li>`; continue; }

function decisionFromSelection(root){

function guessCat(t, cats){ t=(t||"").toLowerCase(); const rules=[["Palette",/colou?r|palette|hex|#[0-9a-f]{3}/],["Typography",/font|type|typeface|serif|sans/],["Audience",/audience|customer|user|persona|for whom/],["Brand personality",/brand words|personality|feel|tone|voice/],["Logo direction",/logo|mark|wordmark|monogram/],["Visual direction",/direction|style|mood|look/],["Goal",/goal|objective|aim/],["Must-haves",/must/],["Requirements",/require|need|spec|size|deadline/]]; for(const [c,re] of rules){ if(cats.includes(c) && re.test(t)) return c; } return cats[0]; }

/* fill [PLACEHOLDERS] with real values; never invent missing ones */
const PH_RE = /\[([A-Z][A-Z0-9 '&\/\-]{1,40})\]/g;
function normWords(t){ return String(t||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>2 && !["the","and","for","your","name"].includes(w)); }
function phValue(j, ph){
  const s=(j.steps||[]).find(x=>x.fills&&x.fills[ph]); /* filled earlier in this plan */
  const p=projById(j.projectId); const key=ph.toUpperCase();
  if(/^(BRAND|BRAND NAME|CLIENT|CLIENT NAME|COMPANY|COMPANY NAME|PROJECT|PROJECT NAME)$/.test(key) && p) return {v:p.client||p.name, label:"Project name"};
  if(/^MUST[- ]?HAVES?$/.test(key) && j.intake && j.intake.musts) return {v:j.intake.musts, label:"Must-haves"};
  if(/^(DEADLINE|DUE DATE)$/.test(key) && j.intake && j.intake.deadline) return {v:j.intake.deadline, label:"Due date"};
  if(j.projectId){ const want=normWords(ph); const ds=decisionsOf(j.projectId).filter(d=>d.status==="confirmed");
    const hit = ds.find(d=>normWords(d.label).join(" ")===want.join(" ")) || ds.find(d=>want.length && want.every(w=>normWords(d.label+" "+d.cat).some(x=>x.startsWith(w.slice(0,5)))));
    if(hit) return {v:hit.text, label:hit.label, dec:hit}; }

}
function fillPrompt(j, s){
  const src=String(s.prompt||""); const missing=[], used=[]; const own=s.fills||{};
  let html="", text="", last=0; PH_RE.lastIndex=0; let m;
  while((m=PH_RE.exec(src))){ const ph=m[1]; html+=esc(src.slice(last,m.index)); text+=src.slice(last,m.index);
    const v = own[ph]!=null ? {v:own[ph], label:ph} : phValue(j, ph);
    if(v && v.v){ html+=`<span class="ph-fill" title="From ${esc(v.label)}">${esc(v.v)}</span>`; text+=v.v; if(!used.some(u=>u.label===v.label)) used.push({label:v.label, dec:v.dec}); }
    else { html+=`<span class="ph-miss">[${esc(ph)}]</span>`; text+=m[0]; if(!missing.includes(ph)) missing.push(ph); }
    last=m.index+m[0].length; }
  html+=esc(src.slice(last)); text+=src.slice(last);
  return {html, text, missing, used};

Her notes:
${text.slice(0,6000)}
Reply with only JSON: {"decisions":[{"category":"one of the categories","label":"2 to 4 word name","text":"the decision in her words, short"}]} with at most 4 items, skipping anything already recorded.`, {modelTier:"quick"});
    const norm=t=>String(t||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
    const list=(v&&Array.isArray(v.decisions)?v.decisions:[]).filter(d=>d&&d.text && !have.some(h=>norm(h.text)===norm(d.text) || (norm(h.label)===norm(d.label) && h.status==="confirmed"))).slice(0,4);
    if(!list.length) return;

    putProject(p);
    toast(`Claude spotted ${list.length} possible decision${list.length===1?"":"s"} in your notes. Review them in the brief.`);
    if(view().v==="focus") refreshSide();

}

function decisionClick(e){

  if(src){ const [jid,sid]=src.dataset.worksrc.split("|"); const j=getJob(jid); const s=j&&stepBySid(j,sid); if(s) openWorkSheet(j,s); else toast("That step isn't there anymore."); return true; }
  if(ad){ decisionForm(ad.dataset.decadd, {cat:decCats(ad.dataset.decadd)[0], status:"confirmed"}, ()=>{ softRender(); refreshSide(); }); return true; }
  if(ok){ const pid=pidOf(ok.dataset.decok); const d=decisionsOf(pid).find(x=>x.id===ok.dataset.decok); putDecision(pid, {...d, status:"confirmed", confirmedAt:Date.now()}); toast("Confirmed. Later prompts will use it."); softRender(); refreshSide(); return true; }
  if(mn){ const pid=pidOf(mn.dataset.decmenu); const d=decisionsOf(pid).find(x=>x.id===mn.dataset.decmenu); e.stopPropagation();
    openMenu(mn,[{label:"Edit", icon:"✎", fn:()=>decisionForm(pid, d, ()=>{ softRender(); refreshSide(); })},
      d.status==="confirmed"?{label:"Back to draft", icon:"↩", fn:()=>{ putDecision(pid,{...d,status:"draft"}); softRender(); refreshSide(); }}:null,

}

/* ================= glossary ================= */
const GLOSS_CATS=["Typography","Layout","Color","UI components","UX","Interaction","Branding","Print","Process","Handy phrases"];
const GLOSS_SEED=`Typography|Typeface|The design of a whole type family (e.g. Inter).
Typography|Font|One weight and style of a typeface (e.g. Inter Bold).
Typography|Serif / Sans serif|Letters with small strokes ("feet") at the ends / letters without them.
Typography|Display font|A showy font made for big sizes, like headlines. Not for paragraphs.
Typography|Body font|An easy-to-read font for paragraphs and small text.
Typography|Weight|How thick the letter strokes are: light, regular, bold and so on.
Typography|Type scale|A set ladder of font sizes (H1, H2, H3, body, caption) used everywhere.
Typography|Typographic hierarchy|Visual hierarchy for text only: what you read first, second, third.
Typography|Leading (line height)|The space between lines of text. Named after strips of lead in metal type.
Typography|Tracking (letter spacing)|Even spacing added or removed across a whole word or line.
Typography|Kerning|The space between two specific letters, like A and V.
Typography|Measure (line length)|How many characters fit on one line. About 45 to 75 is comfortable for body text.
Typography|Eyebrow / overline|A small label above a heading.
Typography|All caps / title case / sentence case|ALL BIG / Every Word Big / Only the first word big.
Typography|Widow / orphan|A lone word or short line stuck at the end of a paragraph or at the top or bottom of a column. Style guides define each slightly differently.
Typography|Legibility|How easy each letter is to tell apart.
Typography|Readability|How easy the whole text is to read.
Layout|Visual hierarchy|The order your eye moves through a design: 1st, 2nd, 3rd.
Layout|Flat hierarchy|Everything looks equally important, so nothing wins.
Layout|Focal point|The one thing your eye lands on first.
Layout|Visual weight|How much something grabs your eye.
Layout|Contrast|How different two things look: size, weight, color, shape.
Layout|Visual differentiation|Making different things look different.
Layout|Grid|Invisible columns and rows that line things up.
Layout|Gutter|The space between grid columns.
Layout|Margin / padding|Space outside a box / space inside a box.
Layout|Whitespace (negative space)|Empty space that lets things breathe.
Layout|Cramped / dense|Too much stuff, not enough space.
Layout|Alignment|Lining things up along the same edge or center.
Layout|Proximity|Things close together look related.
Layout|Grouping|Putting related things together.
Layout|Rhythm / repetition|Repeating patterns that make a design feel organized.
Layout|Balance (symmetric / asymmetric)|How evenly visual weight is spread on the page.
Layout|Rule of thirds|Placing key things on the lines of a 3×3 grid.
Layout|Above the fold|What you see before scrolling.
Layout|Masonry layout|A Pinterest-style grid where images keep their own shape.
Layout|Bento grid|A layout of different-sized boxes, like a lunchbox.
Layout|Responsive|A layout that adapts to phone, tablet and desktop.
Layout|Breakpoint|The screen width where a responsive layout changes.
Color|Hue|The color itself (red, blue).
Color|Saturation|How intense or muted a color is, from vivid to grayish.
Color|Value / lightness|How light or dark a color is.
Color|Tint / shade / tone|A color plus white / plus black / plus gray.
Color|Palette|The set of colors a design uses.
Color|Primary / secondary / accent color|The main color / the support color / the pop color.
Color|Neutral|Grays, whites, blacks, beiges.
Color|Complementary|Colors opposite each other on the color wheel.
Color|Analogous|Colors next to each other on the color wheel.
Color|Monochromatic|Tints and shades of one color.
Color|Color contrast ratio|How readable text is on its background. WCAG AA asks for 4.5:1 for normal text and 3:1 for large text.
Color|RGB / HEX|Screen color formats.
Color|CMYK|The four-ink color model used in print.
Color|Pantone (PMS)|A standard set of numbered inks for exact color matching.
UI components|CTA (call to action)|The main thing you want people to click.
UI components|Primary / secondary / tertiary button|Bold and filled / outlined or quieter / just text.
UI components|Ghost button|A transparent button with only an outline, usually for secondary actions.
UI components|Card|A box that holds one item's info.
UI components|Chip / pill / tag|A small rounded label.
UI components|Badge|A tiny marker, like a count or “New”.
UI components|Modal (dialog)|A box that pops up over the page.
UI components|Drawer / side panel|A panel that slides in from the side.
UI components|Toast / snackbar|A small temporary message, often with Undo.
UI components|Tooltip|A small hint that appears on hover or focus.
UI components|Dropdown / select|A click-to-open list of choices.
UI components|Overflow menu (⋯ / kebab)|A button that hides extra options.
UI components|Hamburger menu (☰)|A three-line icon that opens the navigation.
UI components|Tabs|Buttons that switch views on the same page.
UI components|Accordion / collapsible|A section you can open and close.
UI components|Breadcrumbs|A “Home > Projects > NJC Labs” trail.
UI components|Toggle / switch|An on/off control.
UI components|Checkbox / radio button|Pick many / pick one.
UI components|Input / text field|Where you type.
UI components|Placeholder text|The gray hint inside an empty input.
UI components|Search bar|An input for finding things.
UI components|Filter chips|Clickable tags that narrow a list.
UI components|Pagination / infinite scroll|Numbered pages / keeps loading as you scroll.
UI components|Lightbox|A big pop-up view of one image.
UI components|Carousel / slider|Content that swipes sideways.
UI components|Progress bar / ring|Shows how far along something is.
UI components|Skeleton screen|Gray shapes that show while content loads.
UI components|Empty state|What shows when there's nothing there yet.
UI components|Avatar|A little profile picture or initials circle.
UI components|Placeholder / monogram|A stand-in image, like a colored tile with initials.
UI components|Cover / thumbnail|The preview image on a card.
UI components|Icon|A small symbol that stands for an action or idea.
UI components|Main nav|The main menu, usually at the top.
UI components|Sticky|Stays stuck on screen when you scroll.
UI components|Persistent|Always visible, never hides.
UX|UX (user experience)|How it feels to use something.
UX|UI (user interface)|What you see and click.
UX|Usability|How easy something is to use.
UX|Discoverability|How easy it is to find a feature.
UX|Affordance|A design that hints how to use it (buttons look pressable).
UX|Signifier|The visual clue that shows an affordance, like an underline on a link.
UX|Mental model|How a user expects something to work.
UX|Cognitive load|How much thinking something takes.
UX|Scannability|How easy it is to skim and still get the point.
UX|Visual noise / clutter|Extra stuff that distracts from what matters.
UX|Chrome|All the UI around the content: buttons, labels, borders.
UX|Progressive disclosure|Show the basics first; reveal more when needed.
UX|Information architecture (IA)|How content is organized and labeled.
UX|User flow|The steps someone takes to finish a task.
UX|Friction|Anything that slows a user down (sometimes on purpose, like “Are you sure?”).
UX|Pain point|A spot where users get frustrated.
UX|Edge case|A rare situation the design still needs to handle.
UX|Accessibility (a11y)|Making it usable for everyone, including people with disabilities.
UX|WCAG|The Web Content Accessibility Guidelines: the standard accessibility rules.
UX|Consistency|The same things look and act the same everywhere.
UX|Feedback|The system showing that something happened (a click, a save).
UX|Error state|What shows when something goes wrong.
UX|Onboarding|Helping new users get started.
UX|Entry point|The button or link that starts an action.
Interaction|Hover state|What appears when your mouse sits on something.
Interaction|Active / pressed state|How something looks while being clicked.
Interaction|Focus state|The outline showing where the keyboard is.
Interaction|Disabled state|Grayed out; can't be used.
Interaction|Inline action / inline edit|Doing something right on the card, without a new page.
Interaction|Direct manipulation|Dragging, resizing or editing things right where they are.
Interaction|Read-only view|You can see it but not change it until you press Edit.
Interaction|Confirmation dialog|The “Are you sure?” pop-up.
Interaction|Undo toast|A small pop-up message with an Undo button.
Interaction|Microinteraction|A tiny animation or response, like a heart filling in.
Interaction|Transition|The animation between two states or screens.
Interaction|Easing|How an animation speeds up or slows down.
Interaction|Drag and drop|Grab something and move it.
Interaction|Keyboard shortcut|A key or key combo that does an action fast.
Interaction|Live filter|Results update as you type.
Branding|Brand identity|Everything that makes a brand recognizable.
Branding|Logo / logomark / wordmark|The full logo / the symbol only / the name set in type.
Branding|Lockup|A fixed arrangement of logo, name and sometimes tagline.
Branding|Brand kit / brand guidelines|The rulebook for using the brand.
Branding|Brand voice|How the brand talks.
Branding|Moodboard|A collage of inspiration that sets the vibe.
Branding|Style tiles|A small sample of fonts, colors and UI pieces before the full design.
Branding|Clear space|The empty zone required around a logo.
Branding|Visual language|The overall look and style system.
Print|Bleed|Extra artwork past the trim edge so there's no white edge after cutting.
Print|Trim|Where the paper gets cut.
Print|Safe zone|The area inside the trim where text won't get cut off.
Print|DPI / PPI|Dots per inch (printer output) / pixels per inch (image or screen). Print images usually need about 300 PPI at final size.
Print|Vector / raster|Scales without losing quality (SVG, AI) / made of pixels (JPG, PNG).
Print|Mockup|A realistic preview of a design on a product.
Print|Proof|A test print or preview to check before the final run.
Print|Spot color|One exact premixed ink instead of building it from CMYK.
Print|Die line|The cut and fold outline for packaging.
Process|Wireframe|A simple layout sketch in gray boxes, without final visuals.
Process|Lo-fi / hi-fi|Rough and simple / polished and detailed.
Process|Prototype|A clickable stand-in for the real product.
Process|Design system|A reusable set of styles, components and rules.
Process|Component / variant|A reusable piece / a different version of it (e.g. button small and large).
Process|Design tokens|Named values for colors, sizes and spacing (e.g. color-primary).
Process|Handoff|Passing finished designs to a developer.
Process|Redline / spec|Notes showing exact sizes and spacing.
Process|Iteration|A new round of improvements.
Process|Design critique|Structured feedback on a design.
Process|Heuristic evaluation|Checking a design against known usability rules.
Process|User testing|Watching real people use the design.
Process|Persona|A made-up profile of a typical user, based on research.
Process|Journey map|A diagram of a user's experience over time.
Process|MVP|The simplest version that still does the job.
Handy phrases|“Everything is shouting, so nothing is heard”|No clear hierarchy.
Handy phrases|“Let it breathe”|Add more whitespace.
Handy phrases|“Kill your darlings”|Cut things you love if they don't serve the design.
Handy phrases|“Form follows function”|How it looks should support what it does.`;

function glossTerms(){
  const seed=GLOSS_SEED.split("\n").map(l=>{ const [cat,term,def]=l.split("|"); return {key:"s:"+term, term, def, cat, seed:true}; });
  const mine=(S.gloss||[]).map(g=>({key:"m:"+g.id, id:g.id, term:g.term, def:g.def, cat:g.cat||"Process", ex:g.ex||"", mine:true, at:g.at||0}));
  const overridden=new Set(mine.map(m=>m.term.toLowerCase()));
  return [...mine, ...seed.filter(s=>!overridden.has(s.term.toLowerCase()))];
}
function glossFiltered(st){
  const q=(st.q||"").toLowerCase().trim(); const fav=new Set(prefs().glossFav||[]);
  let list=glossTerms();
  if(st.cat) list=list.filter(t=>t.cat===st.cat);
  if(st.show==="fav") list=list.filter(t=>fav.has(t.key));
  if(st.show==="mine") list=list.filter(t=>t.mine);
  if(st.show==="recent"){ const rec=prefs().glossRecent||[]; list=list.filter(t=>t.mine||rec.includes(t.key)).sort((a,b)=>(b.at||0)-(a.at||0) || rec.indexOf(a.key)-rec.indexOf(b.key)); }
  if(q) list=list.filter(t=>(t.term+" "+t.def).toLowerCase().includes(q)).sort((a,b)=>(b.term.toLowerCase().includes(q))-(a.term.toLowerCase().includes(q)));
  return list;
}
function glossCard(t){
  const fav=(prefs().glossFav||[]).includes(t.key); const ex=t.ex? esc(t.ex) : GLOSS_EX[t.term]||"";
  return `<div class="gterm" data-gkey="${esc(t.key)}"><span class="g-cat">${esc(t.cat)}${t.mine?` <span class="mine-badge">Mine</span>`:""}</span><div class="g-t">${esc(t.term)}</div><div class="g-d">${esc(t.def)}</div>${ex?`<div class="g-ex">${ex}</div>`:""}
    <div class="hover-actions" style="opacity:1"><button class="icon-btn sm ${fav?"on":""}" data-gfav="${esc(t.key)}" aria-pressed="${fav}" aria-label="${fav?"Remove from favorites":"Add to favorites"}" title="Favorite">${fav?"★":"☆"}</button>${t.mine?`<button class="icon-btn sm hover-actions" data-gedit="${esc(t.id)}" aria-label="Edit ${esc(t.term)}">✎</button><button class="icon-btn sm hover-actions" data-gdel="${esc(t.id)}" aria-label="Delete ${esc(t.term)}">🗑</button>`:""}</div></div>`;
}
function glossControls(st, idp){
  return `<div class="stack" style="gap:var(--s3)"><input type="search" id="${idp}Q" placeholder="Search terms and definitions…" value="${esc(st.q||"")}" aria-label="Search the glossary" autocomplete="off" style="width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--paper)">

    <div class="row" style="gap:8px"><div class="seg2" role="group" aria-label="Show">${[["","Everything"],["fav","★ Favorites"],["mine","Mine"],["recent","Recent"]].map(([k,l])=>`<button class="${(st.show||"")===k?"on":""}" data-gshow="${k}">${l}</button>`).join("")}</div><span class="spacer"></span><button class="btn small primary" data-gadd>+ Add term</button></div></div>`;

function glossaryView(){

const CHAT_RULES = `You are Claude inside Jenna's Design Lab. Jenna is a senior graphic designer (about ten years) who runs her own studio. Her struggles, in her words: knowing which steps to take and in what order, jumping ahead to high-fidelity polish before inspiration and direction are set, getting sidetracked, using Claude for work another tool does better, and perfectionism that stalls good work. She wants senior-level work that doesn't look AI-generated.

Your job: answer her question clearly and briefly, using the context below, then tie it back to her current step and its "good enough" bar. You are a focus coach as well as a helper.
- Be concise: usually 2 to 6 short sentences or a few bullets. Plain, warm, direct. No hype, no em dashes.
- If her question pulls away from the current step, answer briefly and suggest parking it.
- If she's polishing before the right stage, or second-guessing work that meets the bar, say so kindly and point to the bar.
- Recommend the right tool from her tool guide; don't default to Claude.
- Never invent facts about the client. Say what you don't know.
- If she shares an image, look at it and give specific, senior-level feedback measured against the brief, kit and current step.

You can change things in the Lab with actions.
- When Jenna directly asks you to make a change the Lab can make (for example "split this step", "add that to the brief", "change the bar on this step", "swap that sentence in my brief"), do it: include the action with "auto": true, and describe it in your answer in the past tense ("Done: I split it into three steps."). Don't ask permission first.
- When she asks for words or ideas (for example "give me another version of this sentence"), just write them in your answer; that is doing it. If the sentence lives in her brief, the step's prompt or her notes and she asked you to change it there, use replace_text with "auto": true. If she didn't ask, you may offer replace_text as a button (no "auto").
- When you have an idea she didn't ask for, offer it as a button (leave out "auto").
- At most 3 actions per reply. After your answer, if there are actions, end with a fenced block exactly like this:
\`\`\`actions
[{"type":"...","label":"short button text", ...fields}]
\`\`\`
Action types (use only these, and only when the needed context exists):
- {"type":"split_step","label":"","parts":["smaller step 1","smaller step 2"]}  replaces the current step with smaller steps
- {"type":"add_step","label":"","title":"","stage":"understand|explore|direction|rough|build|critique|polish|deliver","tag":"you|ai|together","tool":"tool name from the guide or None","minutes":15,"goodEnough":"","prompt":""}  adds a step after the current one
- {"type":"edit_step","label":"","field":"title|goodEnough|prompt|minutes|tool|tag","value":""}  changes the current step
- {"type":"add_note","label":"","text":""}  adds a note to the current step
- {"type":"park","label":"","text":""}  parks a thought for later
- {"type":"save_card","label":"","section":"inspiration|brief|brand","title":"","text":""}  saves a text card to the project
- {"type":"add_to_brief","label":"","text":""}  appends to the project's client brief
- {"type":"replace_text","label":"","target":"brief|step_prompt|step_notes|step_good_enough","find":"exact existing text","replace":"new text"}  swaps text in place; "find" must be copied exactly from the context
Add "auto": true to any action she asked for.
Never include the actions block unless you are offering at least one action.`;

/* ---------- storage ---------- */
function chatSub(key){
  if(S.chat.key===key && S.chat.unsub) return;
  if(S.chat.unsub){ try{ S.chat.unsub(); }catch(e){} S.chat.unsub=null; }
  S.chat.key=key; S.chat.thread=null;
  if(!S.db){ S.chat.thread={messages:[]}; renderChat(); return; }
  S.chat.unsub = S.db.doc("chats/"+key).onSnapshot(s=>{
    if(S.chat.sending) return;
    S.chat.thread = s.exists ? clone(s.data()) : {messages:[]};
    renderChat();
  }, ()=>{ S.chat.thread={messages:[]}; renderChat(); });
}
function saveThread(){
  const t=S.chat.thread; if(!t) return;
  if(t.messages.length>CHAT_MAX) t.messages=t.messages.slice(-CHAT_MAX);
  t.updatedAt=Date.now();
  save("chats/"+S.chat.key, JSON.parse(JSON.stringify(t)));
}

/* ---------- rendering ---------- */
function mdLite(t){
  const lines = esc(t).split("\n"); let html="", inList=false;
  for(const ln of lines){
    const b = ln.match(/^\s*[-*•]\s+(.*)/) || ln.match(/^\s*\d+[.)]\s+(.*)/);
    if(b){ if(!inList){ html+="<ul>"; inList=true; } html+="<li>"+b[1]+"</li>"; continue; }
    if(inList){ html+="</ul>"; inList=false; }
    html += ln.trim() ? "<p>"+ln+"</p>" : "";
  }
  if(inList) html+="</ul>";
  return html.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");
}
function splitActions(text){
  const i = text.indexOf("```actions");
  if(i<0) return {body:text.trim(), actions:[]};
  const body = text.slice(0,i).trim();
  let actions=[]; const rest=text.slice(i+10); const end=rest.indexOf("```");
  try{ actions = JSON.parse(end>=0?rest.slice(0,end):rest); if(!Array.isArray(actions)) actions=[]; }catch(e){ actions=[]; }
  return {body, actions: actions.filter(a=>a && ACTION_TYPES.includes(a.type)).slice(0,3)};
}

/* ---------- asking ---------- */
async function sendChat(text){
  text=(text||"").trim();
  if((!text && !S.chat.images.length) || S.chat.sending || !S.sample) return;
  if(!S.chat.thread) S.chat.thread={messages:[]};
  const scope = chatScope();
  if(scope.key!==S.chat.key){ chatSub(scope.key); }
  const imgs = S.chat.images.splice(0);
  const userMsg = {role:"user", text: text || "(image)", at:Date.now(), by:S.me, images:[]};
  S.chat.thread.messages.push(userMsg);
  S.chat.sending=true; S.chat.streamText=""; renderChat();
  const blobs=[];
  for(const im of imgs){
    blobs.push(im.file);
    try{ const st=await storeFile(im.file, im.file.type); if(st.id) userMsg.images.push(st.id); }catch(e){}
  }
  const history = S.chat.thread.messages.slice(0,-1).slice(-CHAT_HISTORY_TO_MODEL).map(m=>({role:m.role==="user"?"user":"assistant", content:(m.text||"")+(m.images&&m.images.length?" [image attached]":"")}));
  const input = [
    {role:"user", content: CHAT_RULES + "\n\nCONTEXT (current as of this message):\n" + chatContext() + "\n\nI'll ask my questions next."},
    {role:"assistant", content:"Got it. Ask away."},
    ...history,
    {role:"user", content: text || "What do you think of this image, measured against the brief, kit and my current step?"}
  ];
  /* the model needs alternating turns: merge any back-to-back roles */
  const turns=[]; for(const t of input){ const last=turns[turns.length-1]; if(last&&last.role===t.role) last.content+="\n\n"+t.content; else turns.push({...t}); }
  let reply="";
  try{
    const opts={modelTier: S.chat.deep||blobs.length ? "default" : "quick", cache:false,
      onText: ({text:t})=>{ reply=t; S.chat.streamText=t; const el=document.getElementById("chatStream"); if(el){ el.innerHTML=mdLite(splitActions(t).body)||'<span class="spin"></span>'; const log=document.getElementById("chatLog"); if(log) log.scrollTop=log.scrollHeight; } }};
    if(blobs.length) opts.images=blobs;
    const res = await S.sample(turns, opts);
    reply = (res && res.text) || reply;
  }catch(e){
    reply = e && e.code==="rate_limited" ? (e.message||"Claude is busy or this month's AI budget is used up. Try again later.") : "Sorry, that didn't go through. Try again in a moment.";
  }
  const {body, actions} = splitActions(reply);
  S.chat.thread.messages.push({role:"assistant", text: body || "(no answer)", actions, at:Date.now()});
  S.chat.sending=false; S.chat.streamText="";
  const mi = S.chat.thread.messages.length-1; let ran=0;
  actions.forEach((a,k)=>{ if(a.auto===true){ a.auto=false; if(runAction(mi,k,true)) ran++; } });
  saveThread(); renderChat(); if(ran){ render(); toast(ran===1?"Claude made that change.":`Claude made ${ran} changes.`); }
}

/* ---------- doing what the buttons say ---------- */
const ACTION_TYPES = ["split_step","add_step","edit_step","add_note","park","save_card","add_to_brief","replace_text"];
S.chat.undo = {};
function runAction(mi, k, auto){
  const m = S.chat.thread.messages[mi]; const a = m && m.actions && m.actions[k]; if(!a || a.done) return false;
  const {job, pid} = chatScope();
  const cur = job ? curStep(job) : null;
  const needStep = ["split_step","add_step","edit_step","add_note"].includes(a.type);
  const stepTarget = a.type==="replace_text" && String(a.target||"").startsWith("step_");
  const fail = msg=>{ if(auto){ a.failed=msg; } else toast(msg); return false; };
  if((needStep||stepTarget) && (!job || !cur)) return fail("Open the plan or the step this is about, then tap it again.");
  if((needStep||stepTarget) && job.example) return fail("Press “Use this plan” first so changes can be saved.");
  if((["save_card","add_to_brief"].includes(a.type) || (a.type==="replace_text" && a.target==="brief")) && !pid) return fail("Open a project first, then tap it again.");
  const key = mi+":"+k;
  if(needStep||stepTarget) S.chat.undo[key]={kind:"job", snap:clone(job)};
  else if(a.type==="add_to_brief"||(a.type==="replace_text"&&a.target==="brief")) S.chat.undo[key]={kind:"project", snap:clone(projById(pid))};
  const str = v=>String(v||"").slice(0,600);
  let msg = "Done.";
  if(a.type==="split_step"){
    const parts=(Array.isArray(a.parts)?a.parts:[]).map(str).filter(Boolean).slice(0,6); if(parts.length<2) return fail("That split didn't have enough parts.");
    const k0=job.steps.indexOf(cur); const each=Math.max(5, Math.round((+cur.minutes||15)/parts.length));
    const repl=parts.map(t=>({title:t, stage:cur.stage, tag:cur.tag, tool:cur.tool, minutes:each, fidelity:cur.fidelity, goodEnough:"", why:"Split from “"+cur.title+"” to make it easier to start.", prompt:"", check:[]}));
    repl[0].output=cur.output||"";
    job.steps.splice(k0,1,...repl); if(job.pin!=null) job.pin=null;
    putJob(job); msg=`Split into ${parts.length} steps.`;
  } else if(a.type==="add_step"){
    const stage = SPINE_IDX[a.stage]!=null ? a.stage : cur.stage;
    const tool = a.tool && toolByName(a.tool) ? toolByName(a.tool).name : "None";
    const ns={title:str(a.title)||"New step", stage, tag:["you","ai","together"].includes(a.tag)?a.tag:"you", tool, minutes:Math.max(5,Math.min(180,parseInt(a.minutes,10)||15)), fidelity:"mid", goodEnough:str(a.goodEnough), why:"Suggested by Claude.", prompt:str(a.prompt), check:[]};
    job.steps.splice(job.steps.indexOf(cur)+1,0,ns);
    if(job.family){ const pinned=job.pin!=null?job.steps[job.pin]:null; job.steps=sortByStage(job.steps); job.pin=pinned?job.steps.indexOf(pinned):null; }
    putJob(job); msg="Step added.";
  } else if(a.type==="edit_step"){
    const f=a.field;
    if(!["title","goodEnough","prompt","minutes","tool","tag"].includes(f)) return fail("Claude suggested a change the Lab can't make.");
    if(f==="minutes") cur.minutes=Math.max(5,Math.min(180,parseInt(a.value,10)||cur.minutes));
    else if(f==="tool"){ const t=toolByName(a.value); cur.tool = t?t.name:(a.value==="None"?"None":cur.tool); }
    else if(f==="tag"){ if(["you","ai","together"].includes(a.value)) cur.tag=a.value; }
    else cur[f]=str(a.value);
    putJob(job); msg="Step updated.";
  } else if(a.type==="add_note"){
    cur.output = (cur.output?cur.output+"\n":"") + str(a.text); putJob(job); msg="Note added to the step.";
  } else if(a.type==="park"){
    addPark(str(a.text)||"Parked from chat", job&&!job.example?job.id:null, true); S.chat.undo[key]={kind:"park", id:S.parking[0]&&S.parking[0].id}; msg="Parked.";
  } else if(a.type==="save_card"){
    const section=["inspiration","brief","brand"].includes(a.section)?a.section:"inspiration";
    const cid=uid(); putCard({id:cid, projectId:pid, jobId:job&&!job.example?job.id:null, section, tags:[], kind:"note", title:str(a.title)||"From Claude", note:str(a.text), status:"exploring", heart:false, stars:0, notes:[], createdAt:Date.now(), by:S.me}, true); S.chat.undo[key]={kind:"card", id:cid};
    msg=`Saved to ${SECTION_NAME[section]}.`;
  } else if(a.type==="replace_text"){
    const find=String(a.find||""), repl=String(a.replace||"").slice(0,4000);
    const fields={step_prompt:[cur,"prompt"], step_notes:[cur,"output"], step_good_enough:[cur,"goodEnough"], brief:[projById(pid),"brief"]};
    const t=fields[a.target]; if(!t || !t[0]) return fail("Claude pointed at text the Lab can't change.");
    const [obj,field]=t; const before=String(obj[field]||"");
    if(!find || !before.includes(find)) return fail("Couldn't find that exact text to swap. Copy it from the chat instead.");
    obj[field]=before.replace(find, repl);
    if(a.target==="brief"){ obj.briefAt=Date.now(); putProject(obj); } else putJob(job);
    msg="Text swapped.";
  } else if(a.type==="add_to_brief"){
    const p=projById(pid); p.brief=(p.brief?p.brief+"\n\n":"")+str(a.text); p.briefAt=Date.now(); putProject(p); msg="Added to the brief.";
  }
  a.done=true; if(auto) a.auto=true;
  if(!auto){ saveThread(); renderChat(); render(); toast(msg); }
  return true;
}
function undoAction(mi, k){
  const m=S.chat.thread.messages[mi]; const a=m&&m.actions&&m.actions[k]; const u=S.chat.undo[mi+":"+k]; if(!a||!u) return;
  if(u.kind==="job") putJob(u.snap);
  else if(u.kind==="project"){ putProject(u.snap); }
  else if(u.kind==="park"){ const pk=S.parking.find(x=>x.id===u.id); if(pk){ pk.done=true; pk.trashedAt=Date.now(); const {id,...body}=pk; save("parking/"+id, body); S.parking=S.parking.filter(x=>x.id!==u.id); } }
  else if(u.kind==="card"){ const c=S.cards.find(x=>x.id===u.id); if(c){ c.trashedAt=Date.now(); putCard(c,true); S.cards=S.cards.filter(x=>x.id!==u.id); } }
  delete S.chat.undo[mi+":"+k]; a.done=false; a.undone=true; a.auto=false;
  saveThread(); renderChat(); render(); toast("Undone.");
}

/* keep the panel in step with the screen */
window.addEventListener("hashchange", ()=>{ if(S.chat.open){ const k=chatScope().key; if(k!==S.chat.key) chatSub(k); renderChat(); } else { const f=document.getElementById("chatFab"); if(f) f.style.display = view().v==="focus" ? "none" : ""; } });
document.addEventListener("keydown", e=>{ const pnl=document.getElementById("chatPanel"); if(e.key==="Escape" && S.chat.open && pnl && pnl.contains(document.activeElement)){ toggleChat(false); } });
setTimeout(()=>chatShell(), 0);


/* ================= feedback to Nathan ================= */
async function myRole(){ try{ const r=await fetch("/api/me",{credentials:"same-origin"}); return r.ok? (await r.json()) : null; }catch(e){ return null; } }
function feedbackContext(){
  const r=view(); const out={screen:screenName(r)};
  let job=null, pid=null;
  if(r.v==="focus"||r.v==="job"){ job=getJob(r.id); pid=job&&job.projectId; }
  else if(r.v==="project") pid=r.id;
  if(pid) out.project=projName(pid);
  if(job){ out.task=job.title; const c=curStep(job); if(c && r.v==="focus") out.step=c.title; out.jobId=job.example?null:job.id; }
  out.hash=location.hash.slice(1); return out;
}
/* the note is a little editor: screenshots sit in the text where she pastes them */
const FB_MAX_SHOTS = 12;
let fbShots = new Map(); /* object URL -> File */
const FB_MAX_MB = 20;
const fbIsPic = f => /^image\/(png|jpeg|gif|webp)$/.test(f.type);
function fbSize(b){ return b>=1048576 ? (b/1048576).toFixed(1)+" MB" : Math.max(1,Math.round(b/1024))+" KB"; }
function fbInsertImage(ed, file){
  if(!file) return;
  if(fbShots.size >= FB_MAX_SHOTS){ toast(`Up to ${FB_MAX_SHOTS} screenshots and files per note.`); return; }
  if(file.size > FB_MAX_MB*1048576){ toast(`“${file.name}” is over ${FB_MAX_MB} MB. Put a Drive or Dropbox link in the note instead.`); return; }
  const url = URL.createObjectURL(file); fbShots.set(url, file);
  let img;
  if(fbIsPic(file)){ img = document.createElement("img"); img.src = url; img.className = "fb-shot"; img.alt = "Screenshot"; }
  else { img = document.createElement("span"); img.className = "fb-file"; img.contentEditable = "false"; img.dataset.src = url;
    img.innerHTML = `📎 ${esc(file.name||"file")} <small>${fbSize(file.size)}</small>`; }
  const sel = window.getSelection(); let range = null;
  if(sel.rangeCount && ed.contains(sel.getRangeAt(0).commonAncestorContainer)) range = sel.getRangeAt(0);
  else if(ed._lastRange) range = ed._lastRange;
  if(!range){ range = document.createRange(); range.selectNodeContents(ed); range.collapse(false); }
  range.deleteContents();
  /* own line, with a line after it to keep typing */
  const frag = document.createDocumentFragment(); const after = document.createElement("br");
  if(img.tagName==="IMG") frag.append(document.createElement("br"), img, after); else frag.append(img, after); range.insertNode(frag);
  const r2 = document.createRange(); r2.setStartAfter(after); r2.collapse(true);
  sel.removeAllRanges(); sel.addRange(r2); ed._lastRange = r2.cloneRange();
  ed.classList.remove("empty"); ed.focus(); fbCount(ed);
}
function fbCount(ed){
  const n = ed.querySelectorAll("img.fb-shot").length, m = ed.querySelectorAll(".fb-file").length; const el = document.getElementById("fbImgNote");
  const bits = [n?`${n} screenshot${n===1?"":"s"}`:"", m?`${m} file${m===1?"":"s"}`:""].filter(Boolean).join(" and ");
  if(el) el.textContent = bits ? `${bits} in your note · click one and press Delete to remove it` : `screenshots, PDFs, design files, anything up to ${FB_MAX_MB} MB · or paste or drop them right into your note`;
}
/* the editor's contents as text pieces and screenshots, in order */
function fbParts(ed){
  const parts = []; const push = t=>{ if(!t) return; const last = parts[parts.length-1]; if(last && "t" in last) last.t += t; else parts.push({t}); };
  const block = /^(DIV|P|LI|H[1-6]|BLOCKQUOTE|PRE)$/;
  const walk = node=>{
    for(const n of node.childNodes){
      if(n.nodeType === 3) push(n.nodeValue);
      else if(n.nodeName === "BR") push("\n");
      else if(n.nodeName === "IMG"){ if(n.classList.contains("fb-shot") && fbShots.has(n.src)) parts.push({file:fbShots.get(n.src)}); }
      else if(n.nodeType === 1 && n.classList.contains("fb-file")){ if(fbShots.has(n.dataset.src)) parts.push({file:fbShots.get(n.dataset.src)}); }
      else if(n.nodeType === 1){
        const isBlock = block.test(n.nodeName);
        if(isBlock){ const last = parts[parts.length-1]; if(last && "t" in last && last.t && !last.t.endsWith("\n")) push("\n"); }
        walk(n);
        if(isBlock) push("\n");
      }
    }
  };
  walk(ed);
  /* tidy: no stray blank lines around screenshots or at the ends */
  const out = parts.map(p=>"t" in p ? {t:p.t.replace(/ /g," ").replace(/\n{3,}/g,"\n\n")} : p);
  out.forEach((p,i)=>{ if(!("t" in p)) return; if(i>0 && !("t" in out[i-1])) p.t = p.t.replace(/^\n+/,""); if(i<out.length-1 && !("t" in out[i+1])) p.t = p.t.replace(/\n+$/,""); });
  if(out.length && "t" in out[0]) out[0].t = out[0].t.replace(/^\s+/,"");
  if(out.length && "t" in out[out.length-1]) out[out.length-1].t = out[out.length-1].t.replace(/\s+$/,"");
  return out.filter(p=>!("t" in p) || p.t);
}
function openFeedback(){
  for(const u of fbShots.keys()) URL.revokeObjectURL(u); fbShots = new Map();
  const ctx=feedbackContext();
  modal(`<h2>Feedback for Nathan</h2><p class="muted" style="font-size:14px">Anything broken, confusing, missing, or that you love. Add it to tonight's 9 pm email, or send it to him now.</p>
    <div class="rate" id="fbKinds">${[["broken","Something's broken"],["confusing","Confusing"],["idea","Idea"],["love","Love it"]].map(([k,l])=>`<button type="button" class="btn small" data-fbk="${k}">${l}</button>`).join("")}</div>
    <div><label id="fbLabel">What happened, or what would help?</label><div id="fbText" class="fb-editor empty" contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="fbLabel" data-ph="e.g. Can you change this [paste a screenshot] to look more like this [paste another]?"></div></div>
    <div class="row" style="gap:8px"><button type="button" class="btn small" id="fbAttach">📎 Attach files</button><input type="file" id="fbFile" multiple style="display:none"><span class="muted" style="font-size:13px" id="fbImgNote"></span></div>
    <p class="muted" style="font-size:12px">Sent with: ${esc([ctx.screen, ctx.project, ctx.step?`step “${ctx.step}”`:""].filter(Boolean).join(" · "))}</p>
    <div class="row"><button class="btn" id="fbAdd" title="Goes out with tonight's 9 pm email">Add to tonight's email</button><button class="btn primary" id="fbSend" title="Emails Nathan right away">Send now</button><span class="spacer"></span><button class="btn ghost" id="fbCancel">Cancel</button></div>`, {fbCancel:()=>{ S.addPaste=null; closeLayer(); }});
  let kind="idea"; const kinds=document.querySelectorAll("[data-fbk]");
  const pick=k=>{ kind=k; kinds.forEach(b=>b.classList.toggle("on",b.dataset.fbk===k)); }; pick("idea");
  kinds.forEach(b=>b.onclick=()=>pick(b.dataset.fbk));
  const ed=$("#fbText"); fbCount(ed);
  const keepRange=()=>{ const sel=window.getSelection(); if(sel.rangeCount && ed.contains(sel.getRangeAt(0).commonAncestorContainer)) ed._lastRange=sel.getRangeAt(0).cloneRange(); };
  ["keyup","mouseup","input","blur"].forEach(ev=>ed.addEventListener(ev, keepRange));
  ed.addEventListener("input", ()=>{ ed.classList.toggle("empty", !ed.textContent.trim() && !ed.querySelector("img")); fbCount(ed); });
  ed.addEventListener("paste", e=>{
    e.stopPropagation(); e.preventDefault();
    const files=[...(e.clipboardData&&e.clipboardData.files||[])];
    if(files.length){ files.forEach(f=>fbInsertImage(ed,f)); return; }
    const txt=e.clipboardData.getData("text/plain"); if(txt) document.execCommand("insertText", false, txt);
  });
  ed.addEventListener("dragover", e=>{ if([...(e.dataTransfer.items||[])].some(i=>i.kind==="file")) e.preventDefault(); });
  ed.addEventListener("drop", e=>{
    const files=[...(e.dataTransfer.files||[])]; if(!files.length) return;
    e.preventDefault(); e.stopPropagation();
    const pos = document.caretRangeFromPoint ? document.caretRangeFromPoint(e.clientX, e.clientY) : null;
    if(pos && ed.contains(pos.startContainer)){ ed._lastRange = pos; const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(pos); }
    files.forEach(f=>fbInsertImage(ed,f));
  });
  $("#fbAttach").onmousedown=e=>e.preventDefault(); /* keep her place in the text */
  $("#fbAttach").onclick=()=>{ keepRange(); $("#fbFile").click(); };
  $("#fbFile").onchange=()=>{ [...$("#fbFile").files].forEach(f=>fbInsertImage(ed,f)); $("#fbFile").value=""; };
  S.addPaste = fs=>fs.forEach(f=>fbInsertImage(ed,f)); /* pasted while not in the text box: goes where she left off */
  ed.focus();
  const submit=async(now)=>{
    const parts=fbParts(ed);
    if(!parts.length){ ed.focus(); return; }
    const btn=$(now?"#fbSend":"#fbAdd"); btn.disabled=true; $(now?"#fbAdd":"#fbSend").disabled=true;
    const shots=parts.filter(p=>p.file).length;
    btn.innerHTML=`<span class="spin"></span> ${shots?`Uploading ${shots} attachment${shots===1?"":"s"}…`:"Sending…"}`;
    const me=await myRole();
    const body=[]; const images=[]; const files=[]; let n=0, failed=0;
    for(const p of parts){
      if("t" in p){ body.push({t:p.t.slice(0,5000)}); continue; }
      const pic=fbIsPic(p.file); let id=null;
      const ft=fileType(p.file); try{ const st=await storeFile(p.file, pic ? p.file.type : (Object.values(DOC_TYPES).includes(ft) ? ft : "application/octet-stream")); id=st.id||null; }catch(e){}
      if(id && pic){ images.push(id); n++; body.push({img:id, n}); }
      else if(id){ files.push(id); body.push({file:id, name:String(p.file.name||"file").slice(0,200), size:p.file.size, type:p.file.type||""}); }
      else { failed++; body.push({t:`[${pic?"a screenshot":"the file “"+(p.file.name||"")+"”"} couldn't be uploaded]`}); }
    }
    /* plain-text version too, for older readers of this record */
    const text=body.map(b=>b.img?`[screenshot ${b.n}]`:b.file?`[file: ${b.name}]`:b.t).join(" ").replace(/ ?\n ?/g,"\n").trim().slice(0,8000);
    const id=uid(); const doc={text, body, images, files, kind, ...ctx, image:images[0]||null, by:me?me.id:S.me, byName:me?me.name:"", at:Date.now()};
    S.feedback=[{id,...doc}, ...(S.feedback||[])];
    await save("feedback/"+id, doc);
    for(const u of fbShots.keys()) URL.revokeObjectURL(u); fbShots=new Map();
    let sentNow=false, why="";
    if(now){
      btn.innerHTML=`<span class="spin"></span> Emailing Nathan…`;
      try{ const r=await fetch("/api/feedback/send-now",{method:"POST",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify({id})});
        if(r.ok){ sentNow=true; const f=S.feedback.find(x=>x.id===id); if(f) f.sentAt=Date.now(); } else { why=(await r.json().catch(()=>({}))).message||""; } }catch(e){}
    }
    const lost = failed?` (${failed} attachment${failed===1?"":"s"} couldn't be uploaded)`:"";
    S.addPaste=null; closeLayer();
    toast(now ? (sentNow ? `Sent to Nathan${lost}.` : `Couldn't email it right now, so it'll go out in tonight's email instead${lost}.`) : `Added to tonight's email${lost}.`);
    if(now && !sentNow && why) console.warn("send now:", why);
    if(view().v==="settings") render();
  };
  $("#fbSend").onclick=()=>submit(true);
  $("#fbAdd").onclick=()=>submit(false);
}
window.openFeedback = openFeedback;

boot();
</script>
