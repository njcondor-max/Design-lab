<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout idea: a studio job docket. One thing big at a time; everything else quiet at the edges. */
:root{
  --paper:#F2F3EF; --card:#FFFFFF; --ink:#16181D; --muted:#5E6470; --line:#DADDD5;
  --accent:#2F4BFF; --accent-ink:#FFFFFF;
  --you:#C27C00; --you-bg:#FFF2D6;
  --ai:#2F4BFF; --ai-bg:#E5E9FF;
  --tog:#0F8577; --tog-bg:#DDF4F0;
  --good:#1C8A4A; --warn:#B4500F;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:14px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --fs-display:clamp(32px,4.2vw,42px); --fs-page:30px; --fs-task:26px; --fs-phase:19px; --fs-section:17px; --fs-body:15px; --fs-support:14px; --fs-meta:12.5px;
  --soft:#E9EBE5; --raise:0 1px 2px rgba(16,18,24,.05),0 2px 8px rgba(16,18,24,.04);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111318; --card:#1A1D24; --ink:#ECEDEF; --muted:#9CA3AF; --line:#2C313B;
    --accent:#7C8CFF; --accent-ink:#0D0F14;
    --you:#F2B338; --you-bg:#3A2C0C; --ai:#8E9CFF; --ai-bg:#1E2450; --tog:#3CC7B3; --tog-bg:#0E3530;
    --good:#4CC27E; --warn:#F08A4B; --soft:#22262E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111318; --card:#1A1D24; --ink:#ECEDEF; --muted:#9CA3AF; --line:#2C313B;
  --accent:#7C8CFF; --accent-ink:#0D0F14;
  --you:#F2B338; --you-bg:#3A2C0C; --ai:#8E9CFF; --ai-bg:#1E2450; --tog:#3CC7B3; --tog-bg:#0E3530;
  --good:#4CC27E; --warn:#F08A4B; --soft:#22262E; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:var(--fs-body);line-height:1.55}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:var(--fs-page);font-weight:700;letter-spacing:-.015em}
h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
h3{font-size:var(--fs-section);font-weight:700}
p{margin:0}
a{color:var(--accent)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;height:60px}
.brand{font-family:var(--display);font-weight:800;font-size:19px;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--accent);transform:rotate(45deg)}
nav.links{display:flex;gap:4px;margin-left:8px;flex-wrap:wrap}
nav.links a{padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--muted);font-size:15px}
nav.links a.on{color:var(--ink);background:var(--card);box-shadow:0 0 0 1px var(--line)}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;font-size:15px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.big{padding:14px 22px;font-size:17px;border-radius:12px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.park-btn{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.fb-btn{background:transparent}
.fb-btn[hidden]{display:none}
.timerbar{position:sticky;top:60px;z-index:4;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;margin:0 0 14px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px)}
.timerbar.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.timerbar .timer{min-width:90px}
@media (max-width:640px){.fb-btn .lbl{display:none}}
.park-btn b{background:var(--paper);color:var(--ink);border-radius:999px;padding:0 7px;font-size:12px;min-width:20px;text-align:center}
main{padding:28px 0 80px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.banner{padding:10px 14px;border-radius:10px;background:var(--you-bg);color:var(--ink);font-size:14px;border:1px solid color-mix(in srgb,var(--you) 40%,transparent)}
.banner.info{background:var(--ai-bg);border-color:color-mix(in srgb,var(--ai) 35%,transparent)}
label{font-weight:700;font-size:14px;display:block;margin-bottom:6px}
.hint{font-weight:400;color:var(--muted)}
input[type=text],textarea,select{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--paper)}
textarea{resize:vertical;min-height:80px}
.fb-editor{min-height:150px;max-height:52vh;overflow:auto;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--paper);white-space:pre-wrap;word-break:break-word;outline:none;font-size:15px;line-height:1.5}
.fb-editor:focus{border-color:var(--ink)}
.fb-editor.empty:before{content:attr(data-ph);color:var(--muted,#8a8f98);pointer-events:none}
.fb-editor img.fb-shot{display:block;max-width:100%;max-height:240px;border-radius:8px;border:1px solid var(--line);margin:6px 0;cursor:pointer}
.fb-editor .fb-file{display:inline-flex;align-items:center;gap:6px;margin:4px 0;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:700;user-select:all;cursor:default;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.fb-editor .fb-file small{font-weight:400;color:var(--muted)}
.fb-editor img.fb-shot:focus,.fb-editor img.fb-shot::selection{outline:2px solid var(--ink)}
.task-input{display:flex;gap:10px;flex-wrap:wrap}
.task-input input{flex:1 1 320px;font-size:18px;padding:15px 16px;background:var(--card)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.tag.you{color:var(--you);background:var(--you-bg)}
.tag.ai{color:var(--ai);background:var(--ai-bg)}
.tag.together{color:var(--tog);background:var(--tog-bg)}
.chip{display:inline-flex;padding:2px 9px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--muted)}
.chip.ex{border-color:var(--you);color:var(--you)}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.job{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink);cursor:pointer}
.job:hover{border-color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.next{font-size:14px}
.next b{font-weight:700}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:start;padding:14px 16px}
.step .n{font-family:var(--display);font-weight:800;font-size:20px;color:var(--muted);font-variant-numeric:tabular-nums}
.step.done{opacity:.55}
.step.done .n{color:var(--good)}
.step.skipped{opacity:.45}
.step.current{box-shadow:0 0 0 2px var(--accent)}
.step .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px;font-size:14px;color:var(--muted)}
.step .tools{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.edit-area{grid-column:1/-1;display:grid;gap:10px;padding-top:6px;border-top:1px dashed var(--line);margin-top:4px}
.edit-area .two{display:grid;grid-template-columns:1fr 1fr 110px;gap:10px}
@media (max-width:600px){.edit-area .two{grid-template-columns:1fr}.step{grid-template-columns:28px 1fr}.step .tools{grid-column:1/-1;justify-content:flex-start}}
.focus{max-width:760px;margin:0 auto}
.focus-card{padding:28px;border-radius:20px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:18px;border-top:6px solid var(--accent)}
.focus-card.you{border-top-color:var(--you)}
.focus-card.together{border-top-color:var(--tog)}
.focus-card h1{font-size:clamp(26px,4vw,38px)}
.prompt-box{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;white-space:pre-wrap;font-size:15px;max-height:260px;overflow:auto}
.useline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:var(--paper)}
.useline .tname{font-family:var(--display);font-weight:800;font-size:20px}
.later{display:flex;flex-direction:column;gap:6px;margin-top:20px}
.later div{padding:10px 14px;border-radius:10px;border:1px dashed var(--line);color:var(--muted);font-size:14px}
.timer{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;font-size:18px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.parklist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.parklist li{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--paper);border:1px solid var(--line)}
.parklist li span{flex:1}
.parklist li.done span{text-decoration:line-through;color:var(--muted)}
.tool-row{display:grid;grid-template-columns:160px 1fr 1fr 70px;gap:10px;align-items:start}
@media (max-width:760px){.tool-row{grid-template-columns:1fr}}
.kind{font-size:12px;font-weight:700;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(10,12,16,.45);display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;z-index:20}
.modal{background:var(--card);border-radius:16px;padding:22px;width:min(560px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.legend span{display:flex;gap:6px;align-items:center}
.spin{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.kbd{font-size:12px;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--muted)}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.status{font-size:13px;color:var(--muted)}

.stage-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:14px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.stage-head h3{font-size:18px}
.stage-head .bar-text{font-size:14px;color:var(--muted);flex:1 1 300px}
.stage-head .count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stage-head.done h3{color:var(--good)}
.stage-chip{display:inline-flex;padding:3px 10px;border-radius:999px;background:var(--ink);color:var(--paper);font-size:12px;font-weight:700;letter-spacing:.02em}
.fid{display:inline-flex;padding:2px 8px;border-radius:6px;border:1px dashed var(--muted);font-size:12px;font-weight:700;color:var(--muted)}
.fid.final{border-style:solid;border-color:var(--ink);color:var(--ink)}
.spine{display:flex;gap:4px;flex-wrap:wrap}
.spine span{font-size:12px;font-weight:700;padding:4px 9px;border-radius:6px;background:var(--line);color:var(--muted)}
.spine span.on{background:var(--accent);color:var(--accent-ink)}
.spine span.past{background:color-mix(in srgb,var(--good) 22%,transparent);color:var(--good)}
.goodenough{padding:12px 14px;border-radius:12px;border:2px solid var(--good);background:color-mix(in srgb,var(--good) 8%,transparent)}
.goodenough b{color:var(--good)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg label{margin:0;padding:9px 14px;font-weight:700;font-size:14px;cursor:pointer;background:var(--card)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{color:var(--accent)}
.seg label:has(input:checked){background:var(--ai-bg)}
.timetable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.timetable th,.timetable td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.timetable td.over{color:var(--warn);font-weight:700}
.pb-stage{display:grid;grid-template-columns:150px 1fr 1fr;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
@media (max-width:760px){.pb-stage{grid-template-columns:1fr}}
.rate{display:flex;gap:8px;flex-wrap:wrap}
.rate button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.results{width:100%;border-collapse:collapse;font-size:14px}
.results th,.results td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}

.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:0}
.tab{border:0;background:transparent;padding:10px 12px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab b{font-weight:700;font-size:12px;background:var(--line);border-radius:99px;padding:1px 7px;margin-left:4px;color:var(--muted)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tagchip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.tagchip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tagchip.sm{padding:1px 8px;font-size:11px;cursor:default}
.masonry{columns:4 220px;column-gap:14px}
.tile{break-inside:avoid;margin:0 0 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.tile.sel{box-shadow:0 0 0 3px var(--accent)}
.tile.parked{opacity:.5}
.tile.chosen{border-color:var(--good);box-shadow:0 0 0 2px var(--good)}
.tface{display:block;color:inherit;text-decoration:none;background:var(--paper)}
.tface img{display:block;width:100%;height:auto}
.tmeta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.ttitle{font-weight:700;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.linkface .ld{display:flex;flex-direction:column;gap:2px;padding:14px;background:var(--ai-bg)}
.noteface{padding:16px;font-size:14px;white-space:pre-wrap;background:var(--you-bg);color:var(--ink)}
.heart{border:0;background:transparent;font-size:18px;line-height:1;color:var(--line);cursor:pointer;padding:2px 4px;border-radius:6px}
.heart.on{color:#E0245E}
.heart.big{font-size:15px;font-weight:700;border:1px solid var(--line);padding:8px 12px;color:var(--muted)}
.heart.big.on{color:#E0245E;border-color:#E0245E}
.star{border:0;background:transparent;font-size:16px;line-height:1;color:var(--line);cursor:pointer;padding:2px}
.star.on{color:var(--you)}
.star.big{font-size:24px}
.cmp{font-size:12px;font-weight:700;color:var(--muted);display:flex;gap:4px;align-items:center;margin:0;cursor:pointer}
.st{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--ink)}
.st.starred{background:var(--you-bg);color:var(--you)} .st.shortlisted{background:var(--ai-bg);color:var(--ai)} .st.chosen{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.cover{height:130px;background:var(--ai-bg) center/cover no-repeat;display:flex;align-items:center;justify-content:center}
.cover span{font-family:var(--display);font-weight:800;font-size:44px;color:var(--ai)}
.dropzone{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);cursor:pointer}
.dropzone.over{border-color:var(--accent);background:var(--ai-bg);color:var(--ink)}
.savewall{display:flex;gap:10px;align-items:center;flex-wrap:wrap;text-align:left;font-size:14px;padding:12px 14px;border-radius:12px;background:var(--paper)}
.savewall.dropzone{border-style:dashed}
.cardgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:start}
@media (max-width:860px){.cardgrid{grid-template-columns:1fr}}
.bigimg{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.bigimg img{display:block;width:100%;height:auto}
.cmpgrid{display:grid;gap:14px}
@media (max-width:700px){.cmpgrid{grid-template-columns:1fr!important}}
.note-item{padding:8px 12px;border-radius:10px;background:var(--paper);font-size:14px}
.brand{white-space:nowrap}
nav.links{flex-wrap:nowrap;overflow-x:auto;min-width:0;scrollbar-width:none}
nav.links a{white-space:nowrap}
.status{white-space:nowrap;font-size:12px}
@media (max-width:1100px){.status{display:none}}
.focuswrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;max-width:1140px;margin:0 auto;align-items:start}
.focuswrap .focus{max-width:none;margin:0}
.drawer{position:sticky;top:76px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;max-height:calc(100vh - 96px);overflow:auto}
.drawer .tabs .tab{padding:8px 10px;font-size:13px}
.drawer-close,.drawer-fab{display:none}
@media (max-width:1000px){
  .focuswrap{grid-template-columns:1fr}
  .drawer{position:fixed;right:0;top:0;bottom:0;width:min(360px,90vw);max-height:none;border-radius:0;transform:translateX(105%);transition:transform .2s;z-index:15;box-shadow:-12px 0 40px rgba(0,0,0,.18)}
  .drawer.open{transform:none}
  .drawer-close{display:inline-flex}
  .drawer-fab{display:inline-flex;position:fixed;right:16px;bottom:16px;z-index:14}
}
@media (prefers-reduced-motion: reduce){.drawer{transition:none}}
.drgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.drthumb{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;padding:0;background:var(--paper);aspect-ratio:1;cursor:pointer}
.drthumb img{width:100%;height:100%;object-fit:cover;display:block}
.drthumb i{position:absolute;top:2px;right:5px;color:#E0245E;font-style:normal}
.drthumb span{font-size:11px;padding:4px;display:block;text-align:left}
.dot{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:inline-block}
.palette{display:flex;flex-direction:column;gap:8px}
.sw{display:grid;grid-template-columns:36px 110px 1fr 1fr auto;gap:8px;align-items:center}
@media (max-width:700px){.sw{grid-template-columns:36px 1fr 1fr}}
.chip-color{width:36px;height:36px;border-radius:8px;border:1px solid var(--line)}
.refrow{display:flex;gap:12px;align-items:center}
.refrow img{width:72px;height:54px;object-fit:cover;border-radius:8px}
.refpick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

.fhead{position:sticky;top:60px;z-index:6;display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;padding:10px 0;margin-bottom:var(--s4);background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}

.ws-foot{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;padding:8px var(--s4);border-top:1px solid var(--line);font-size:12px;color:var(--muted)}

.ws-ro img{max-width:100%;border-radius:8px;margin:6px 0;cursor:zoom-in}
.ws-ro p{margin:0 0 6px}.ws-ro ul,.ws-ro ol{margin:0 0 6px;padding-left:20px}
.atts{display:flex;flex-direction:column;gap:var(--s3)}
.att-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.att{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper);display:flex;flex-direction:column}
.att .a-face{display:block;border:0;padding:0;background:var(--paper);cursor:zoom-in;aspect-ratio:4/3;width:100%}
.att .a-face img{width:100%;height:100%;object-fit:cover;display:block}
.att .a-doc{display:flex;flex-direction:column;justify-content:center;gap:4px;padding:12px;font-size:12px;height:100%;text-align:left;overflow:hidden}

.role{font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px;border:0;cursor:pointer}
.role.ref{background:var(--ai-bg);color:var(--ai)}
.role.mine{background:var(--you-bg);color:var(--you)}
.figma{background:#1e1e1e;color:#fff}
.att-drop{border:1.5px dashed var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:var(--fs-support);color:var(--muted)}
.att-drop.over{border-color:var(--accent);background:var(--ai-bg);color:var(--ink)}
/* decisions & living brief */
.dec-group{display:flex;flex-direction:column;gap:6px}
.dec-group h4{margin:0;font-size:var(--fs-meta);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dec{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 12px;border-radius:12px;background:var(--paper);border:1px solid var(--line)}
.dec .d-label{font-weight:700;font-size:13px}
.dec .d-text{font-size:var(--fs-support);white-space:pre-wrap}
.dec .d-src{font-size:12px;color:var(--muted)}
.dstat{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap}
.dstat.confirmed{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.dstat.draft{background:var(--soft);color:var(--muted)}
.dstat.proposed{background:var(--you-bg);color:var(--you)}
.brief-ro{white-space:pre-wrap;font-size:var(--fs-support);line-height:1.65;max-height:420px;overflow:auto;padding:var(--s4);background:var(--paper);border-radius:12px;border:1px solid var(--line)}
/* documents */
.docrows{display:flex;flex-direction:column;gap:6px}
.docrow{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.docrow .dico{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;background:var(--soft);color:var(--muted);overflow:hidden}
.docrow .dico img{width:100%;height:100%;object-fit:cover}
/* image-first gallery + lightbox */
.gallery{columns:3 280px;column-gap:16px}
.gallery.two{columns:2 300px}
.gtile{break-inside:avoid;margin:0 0 16px;position:relative;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.gtile.sel{box-shadow:0 0 0 3px var(--accent)}
.gtile .g-face{display:block;width:100%;border:0;padding:0;background:var(--paper);cursor:zoom-in}
.gtile .g-face img{display:block;width:100%;height:auto}
.gtile .g-over{position:absolute;inset:auto 0 0 0;display:flex;gap:4px;align-items:center;padding:8px;background:linear-gradient(transparent,rgba(0,0,0,.55));opacity:0;transition:opacity .12s}
.gtile:hover .g-over,.gtile:focus-within .g-over{opacity:1}
@media (hover:none){.gtile .g-over{opacity:1}}
.gtile .g-over .icon-btn{background:rgba(255,255,255,.92);color:#16181D}
.gtile .g-over .icon-btn.on{color:#E0245E}
.gtile .g-heart{position:absolute;top:8px;right:8px;color:#E0245E;font-size:16px;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.gtile .g-cap{padding:10px 12px;font-size:13px}
.lb{position:fixed;inset:0;z-index:35;background:rgba(8,9,12,.92);display:grid;grid-template-columns:56px 1fr 56px;grid-template-rows:auto 1fr auto;color:#fff}
.lb .lb-top{grid-column:1/-1;display:flex;gap:10px;align-items:center;padding:12px 16px}
.lb .lb-top .t{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .lb-img{grid-column:2;display:flex;align-items:center;justify-content:center;min-height:0;padding:8px}
.lb .lb-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lb .nav{display:flex;align-items:center;justify-content:center}
.lb .icon-btn{color:#fff;font-size:20px;width:44px;height:44px}

.lb .icon-btn.on{color:#FF5C8A}
.lb .lb-foot{grid-column:1/-1;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 16px 16px;font-size:13px;opacity:.9}
.lb .lb-foot a{color:#B9C3FF}
/* parking lot */
.pgroup{border:1px solid var(--line);border-radius:16px;background:var(--card)}
.pgroup>summary{list-style:none;cursor:pointer;display:flex;gap:var(--s3);align-items:center;padding:var(--s4) var(--s5)}

.prow .p-text{font-size:var(--fs-body)}
.prow .p-meta{font-size:12px;color:var(--muted);margin-top:2px}
.prow.done .p-text{text-decoration:line-through;color:var(--muted)}
/* workspace */
.ws-items{display:flex;flex-direction:column;gap:var(--s3)}
.ws-item{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:var(--s4) var(--s5);display:flex;flex-direction:column;gap:var(--s2)}
.ws-item .wi-head{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.ws-item .wi-sum{font-size:var(--fs-support);color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ws-thumbs{display:flex;gap:6px;flex-wrap:wrap}
.ws-thumbs button{width:72px;height:56px;border-radius:8px;overflow:hidden;border:1px solid var(--line);padding:0;cursor:zoom-in;background:var(--paper)}
.ws-thumbs img{width:100%;height:100%;object-fit:cover}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg2 button{border:0;background:transparent;padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}

/* glossary */
.gterms{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--s3)}
.sheet .gterms{grid-template-columns:1fr}
.gterm{position:relative;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:var(--s4);display:flex;flex-direction:column;gap:6px}
.gterm .g-t{font-weight:700;font-family:var(--display);font-size:16px;display:flex;gap:8px;align-items:center}
.gterm .g-d{font-size:var(--fs-support);color:var(--ink)}
.gterm .g-ex{font-size:13px;padding:8px 10px;border-radius:8px;background:var(--paper)}
.gterm .g-cat{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.gterm .hover-actions{position:absolute;top:8px;right:8px;display:flex}
.gvis{font-family:var(--display);font-size:20px;line-height:1.1}
.mine-badge{font-size:10px;font-weight:800;background:var(--ai-bg);color:var(--ai);padding:1px 6px;border-radius:999px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

<script>
/* ================= constants ================= */
const TAGS = {
  you: {label:"You", help:"Taste, judgment, client calls. Your hands."},
  ai: {label:"AI does it", help:"A tool does the whole step. You check it."},
  together: {label:"Together", help:"AI drafts, you edit."}
};
const FID = {rough:"Rough", mid:"Mid", final:"Final"};

/* The spine: every task, every family, in this order. Nothing starts with polish. */
const SPINE = [
  {key:"understand", name:"Understand"},
  {key:"explore", name:"Explore"},
  {key:"direction", name:"Direction"},
  {key:"rough", name:"Rough"},
  {key:"build", name:"Build"},
  {key:"critique", name:"Critique"},
  {key:"polish", name:"Polish"},
  {key:"deliver", name:"Deliver"}
];
const SPINE_IDX = Object.fromEntries(SPINE.map((s,i)=>[s.key,i]));

const STARTER_GUIDE = [
  {id:"claude", name:"Claude", kind:"ai", goodFor:"Writing and rewriting copy, briefs and client emails; critiquing a design from a screenshot; research summaries; longer jobs that end in a finished file (report, deck, spreadsheet)", avoidFor:"Making finished images", link:"https://claude.ai"},
  {id:"chatgpt", name:"ChatGPT", kind:"ai", goodFor:"Quick questions; brainstorm lists of names, taglines and angles; fast back-and-forth ideas (the Chat tab)", avoidFor:"Long documents where every fact must be right", link:"https://chatgpt.com"},
  {id:"chatgpt-work", name:"ChatGPT Work", kind:"ai", goodFor:"Handing off a multi-step job that ends in a deliverable: competitor research, a brief or report as a doc, sorting files, anything you'd otherwise click through yourself (the Work tab)", avoidFor:"Quick questions; anything you need back in 2 minutes", link:"https://chatgpt.com"},
  {id:"gemini", name:"Gemini", kind:"ai", goodFor:"Image generation and editing (Nano Banana): mood images, hero shots, mockup scenes, quick visual directions", avoidFor:"Final vector or print-ready art", link:"https://gemini.google.com"},
  {id:"figma", name:"Figma", kind:"hands", goodFor:"Layouts, UI screens, wireframes, prototypes, design systems", avoidFor:"Print production files", link:"https://www.figma.com"},
  {id:"illustrator", name:"Illustrator", kind:"hands", goodFor:"Logos, vector art, packaging dielines, print-ready files", avoidFor:"Clickable prototypes", link:""}
];

/* Families: each maps the spine to its own goals, bars and typical steps. */
const STARTER_PLAYBOOKS = [
  {id:"web", name:"Web & UI", blurb:"Websites, landing pages, app screens, UI overhauls", polishBudget:60, stages:{
    understand:{goal:"Goal, audience, must-haves, and what exists today", bar:"A one-line goal, 3 to 5 must-haves and a page list", steps:"Write the one-line goal and must-haves\nList the pages or screens\nCheck what content and copy already exist\nRedesign: audit the current site (what works, what's broken)"},
    explore:{goal:"Inspiration before pixels", bar:"10 to 20 saved references and 3 named patterns", steps:"Competitor and reference scan\nFree exploration, timed\nMoodboard of the references you'd actually steal from"},
    direction:{goal:"One direction, decided", bar:"One chosen direction: type pair, palette, image style, one hero sketch. Signed off.", steps:"Make 2 to 3 style tiles\nPick one (client or self sign-off)"},
    rough:{goal:"Wireframes", bar:"Gray boxes with real headings for every key page. No colour, no fonts.", steps:"Wireframe the key pages\nDraft the copy into the wireframes"},
    build:{goal:"High-fidelity design", bar:"Key pages at desktop in the chosen direction, real copy, then mobile", steps:"Design the homepage\nDesign the inner pages\nAdapt to mobile"},
    critique:{goal:"One critique round", bar:"Checked once against the must-haves. If it passes, it ships.", steps:"One critique against the must-haves"},
    polish:{goal:"Details, inside a budget", bar:"Fix list done or polish budget spent, whichever comes first", steps:"Spacing and type pass\nHover and empty states"},
    deliver:{goal:"Out the door", bar:"Shared with the client or handed to the developer", steps:"Prototype link and export\nHandoff notes"}
  }},
  {id:"brand", name:"Brand identity", blurb:"Logos, identity systems, rebrands", polishBudget:60, stages:{
    understand:{goal:"What the brand stands for", bar:"Three words the brand must feel like, the audience, and 3 competitors", steps:"Brief: values, audience, three brand words\nCompetitor scan\nRebrand: what must survive from the old identity"},
    explore:{goal:"Ideas before vectors", bar:"A page of word associations, references and 20+ thumbnail sketches", steps:"Word associations and metaphors\nReference board\nFree exploration: thumbnail sketches, timed"},
    direction:{goal:"Pick the concept", bar:"2 to 3 concepts narrowed to one, with a one-line rationale", steps:"Develop 2 to 3 concepts roughly\nChoose one and write why"},
    rough:{goal:"Black and white first", bar:"The mark works in black and white at small and large sizes", steps:"Vector the mark in black and white\nTest at favicon and billboard sizes"},
    build:{goal:"The system", bar:"Mark, colour, type and 3 real applications", steps:"Refine the mark\nColour and type system\nMock it on 3 real applications"},
    critique:{goal:"One critique round", bar:"Checked once against the three brand words and the brief", steps:"One critique against the brief"},
    polish:{goal:"Details, inside a budget", bar:"Fix list done or budget spent", steps:"Optical kerning and curve cleanup"},
    deliver:{goal:"Hand it over", bar:"Logo files in every format plus a short brand guide", steps:"Export logo package\nOne-page brand guide"}
  }},
  {id:"packaging", name:"Packaging & print", blurb:"Bags, boxes, labels, cans, posters, menus", polishBudget:45, stages:{
    understand:{goal:"Specs before ideas", bar:"Dieline or size, material, print method, required copy and legal text in hand", steps:"Get the dieline, size and material\nAsk the printer for specs and limits\nCollect required copy and legal text\nRedesign: what must stay recognisable"},
    explore:{goal:"See the shelf", bar:"A shelf of 10+ competitor and reference pieces, 3 patterns named", steps:"Shelf and competitor scan\nFree exploration, timed\nMaterial and finish references"},
    direction:{goal:"One concept, decided", bar:"One concept as a flat sketch with palette and type. Signed off.", steps:"Sketch 2 to 3 concepts flat\nPick one"},
    rough:{goal:"Layout on the dieline", bar:"Every panel laid out in black and white with real copy", steps:"Place copy and hierarchy on every panel"},
    build:{goal:"Full art", bar:"Final art on the dieline and a 3D mockup check", steps:"Final art on the dieline\n3D mockup check"},
    critique:{goal:"One critique round", bar:"Checked once against specs, must-haves and shelf impact", steps:"One critique against specs and must-haves"},
    polish:{goal:"Details, inside a budget", bar:"Fix list done or budget spent", steps:"Colour and detail pass"},
    deliver:{goal:"Print-ready", bar:"Print-ready files sent and a proof checked", steps:"Preflight and export print files\nCheck the printer's proof"}
  }},
  {id:"social", name:"Social & campaign", blurb:"Post sets, ads, campaign graphics", polishBudget:20, stages:{
    understand:{goal:"Goal and specs", bar:"Goal, platform sizes and number of pieces written down", steps:"Write the goal, platforms and sizes\nCollect brand assets"},
    explore:{goal:"Angles and references", bar:"5 references and 10 angle ideas", steps:"Angle brainstorm\nReference scan"},
    direction:{goal:"One look", bar:"One template that the whole set follows", steps:"Design one template"},
    rough:{goal:"Copy and layouts", bar:"All copy written, rough layout per piece", steps:"Write all the copy\nRough each piece"},
    build:{goal:"Produce the set", bar:"Every piece finished in every size", steps:"Produce the set\nResize for each platform"},
    critique:{goal:"One critique round", bar:"Checked once against the goal", steps:"One critique against the goal"},
    polish:{goal:"Light polish", bar:"Budget spent", steps:"Final consistency pass"},
    deliver:{goal:"Out the door", bar:"Exported, named and scheduled or sent", steps:"Export and name files\nSchedule or send"}
  }},
  {id:"other", name:"Other / one-off", blurb:"Anything that doesn't fit the others", polishBudget:30, stages:{
    understand:{goal:"What done looks like", bar:"Goal, specs and must-haves written down", steps:"Write the goal and must-haves"},
    explore:{goal:"Look around first", bar:"A handful of references", steps:"Reference scan\nFree exploration, timed"},
    direction:{goal:"Decide", bar:"One direction chosen", steps:"Pick a direction"},
    rough:{goal:"Rough version", bar:"Everything in place roughly, no details", steps:"Rough version"},
    build:{goal:"Real version", bar:"Finished at full fidelity", steps:"Real version"},
    critique:{goal:"One critique round", bar:"Checked once against the must-haves", steps:"One critique"},
    polish:{goal:"Details, inside a budget", bar:"Budget spent", steps:"Detail pass"},
    deliver:{goal:"Hand it over", bar:"Sent", steps:"Export and send"}
  }}
];

const EXAMPLE = {
  id:"example", example:true, title:"Homepage redesign for a vending brand", family:"web", fresh:"redesign",
  summary:"Get the facts and references straight, decide one direction, wireframe before you design, and keep polish inside its budget.",
  intake:{deadline:"Friday", have:"Current site, logo files", done:"Homepage ready for client review", today:"3 hours", musts:"Clear 'find a machine' button; feels premium, not cheap; works on phones"},
  status:"active",
  steps:[
    {stage:"understand", title:"Write the goal and the must-haves", tag:"you", tool:"None", minutes:10, fidelity:"rough", goodEnough:"One sentence and 3 bullets. Not polished.", why:"Every later step leans on this.", prompt:"Write: who the homepage is for, the one action they should take, and 3 must-haves from the client."},
    {stage:"understand", title:"Audit the current homepage", tag:"together", tool:"Claude", minutes:15, fidelity:"rough", goodEnough:"A keep / fix / drop list", why:"A redesign starts from what exists. Claude spots issues fast from a screenshot.", prompt:"Here's a screenshot of a homepage for [BRAND NAME], a mystery-box vending company. List what to keep, what to fix and what to drop, 3 to 5 bullets each. Judge it on: clarity of the main action, trust, mobile readability.", check:["Each point is about this page, not generic advice"]},
    {stage:"explore", title:"Competitor and reference scan", tag:"ai", tool:"ChatGPT Work", minutes:15, fidelity:"rough", goodEnough:"5 sites, 3 patterns named", why:"Research is legwork. Hand it off and only read the result.", prompt:"Research 5 homepages of novelty or mystery-box vending brands. For each: headline, main call to action, what's above the fold, one thing that works. End with the 3 patterns that show up most.", check:["Every site is a real, live brand","Patterns are things you could actually use"]},
    {stage:"explore", title:"Free exploration", tag:"you", tool:"Figma", minutes:25, fidelity:"rough", goodEnough:"Messy is the point. Stop when the timer ends.", why:"Play gets its own time box, so it doesn't take over later steps.", prompt:"Scribble hero ideas, type pairings, anything. No spacing, no alignment, no saving for later."},
    {stage:"direction", title:"Three style tiles, pick one", tag:"you", tool:"Figma", minutes:40, fidelity:"mid", goodEnough:"Type pair, palette, image style and a hero sketch. One chosen.", why:"Deciding the look once stops it changing on every page.", prompt:"Make 3 style tiles from the references. Pick one and write one line on why."},
    {stage:"rough", title:"Wireframe the homepage", tag:"you", tool:"Figma", minutes:40, fidelity:"rough", goodEnough:"Gray boxes, real headings, no colour, no fonts", why:"Structure first. Details here are wasted if the layout moves.", prompt:"Wireframe desktop: hero, how it works, find a machine, social proof, footer. Gray boxes only."},
    {stage:"rough", title:"Draft the copy into the wireframe", tag:"together", tool:"Claude", minutes:15, fidelity:"mid", goodEnough:"Real words in every box, good enough to judge the layout", why:"Real copy shows if the layout works. Claude drafts, you cut.", prompt:"Write homepage copy for [BRAND NAME], a mystery-box vending machine company. Must-haves: [MUST-HAVES]. Sections: hero (3 headline options + subhead), how it works (3 steps), find a machine, social proof placeholder, footer. Plain, playful, no hype words, no invented stats.", check:["Headlines under 8 words","No made-up prices, stats or reviews"]},
    {stage:"build", title:"Design the homepage, desktop", tag:"you", tool:"Figma", minutes:90, fidelity:"final", goodEnough:"Every section designed in the chosen direction with real copy", why:"This is the taste work. Your hands, your call.", prompt:"Design desktop from the wireframe and style tile."},
    {stage:"build", title:"Adapt to mobile", tag:"you", tool:"Figma", minutes:40, fidelity:"final", goodEnough:"390px frame with every section", why:"Most visitors are on phones.", prompt:"Adapt each section to a 390px frame."},
    {stage:"critique", title:"One critique against the must-haves", tag:"together", tool:"Claude", minutes:15, fidelity:"final", goodEnough:"A fix list of 5 or fewer. If the must-haves pass, it ships.", why:"One round, measured against the brief, instead of endless second-guessing.", prompt:"Here are screenshots of a homepage design (desktop and mobile). Must-haves: [MUST-HAVES]. For each must-have, say pass or fail and why. Then list at most 5 fixes, most important first. Do not suggest a new direction.", check:["Every must-have got a pass or fail"]},
    {stage:"polish", title:"Fix list and detail pass", tag:"you", tool:"Figma", minutes:45, fidelity:"final", goodEnough:"Fix list done or 45 minutes spent, whichever comes first", why:"Details get a budget, not forever.", prompt:"Work the fix list top down. Stop when it's done or the timer ends."},
    {stage:"deliver", title:"Share with the client", tag:"you", tool:"Figma", minutes:15, fidelity:"final", goodEnough:"Link sent with 3 lines of context", why:"Done is shipped.", prompt:"Share the prototype link with a short note: what changed, what you want feedback on, by when."}
  ]
};

/* ================= state ================= */
const S = {db:null, user:null, sample:null, me:null, jobs:[], parking:[], guide:null, playbooks:null,
  loaded:{jobs:false}, editing:null, timer:null, local:false, example:clone(EXAMPLE), clock:null,
  projects:[], cards:[], assets:null, localBlobs:{}, wallSection:{}, wallTag:{}, showParked:false, compare:[], draftProject:null,
  board:{tag:"", project:"", hearts:false, minStars:0, allSections:false, sort:"new"}, curHash:"", lastHash:"",
  kits:{}, projTab:{}, wsView:{}, peekSid:{}, drawerTab:"insp", drawerSec:"inspiration", drawerOpen:false, work:{}, gloss:[], prefs:null};
function clone(o){return JSON.parse(JSON.stringify(o))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function guide(){return (S.guide && S.guide.length) ? S.guide : STARTER_GUIDE}
function playbooks(){return (S.playbooks && S.playbooks.length) ? S.playbooks : STARTER_PLAYBOOKS}
function family(id){return playbooks().find(f=>f.id===id) || playbooks().find(f=>f.id==="other") || playbooks()[0]}
function toolByName(n){return guide().find(t=>t.name.toLowerCase()===String(n||"").toLowerCase())}
function stageName(k){return (SPINE.find(s=>s.key===k)||{name:k||"Steps"}).name}
function stageBar(j,k){const f=family(j.family); return f&&f.stages[k]?f.stages[k].bar:"";}
const $ = s=>document.querySelector(s);

/* ================= saving ================= */
const chains = {}; let pending = 0;
function setStatus(){ $("#saveStatus").textContent = S.local ? "Not saving: this view has no storage" : pending ? "Saving…" : ""; }
function save(path, data){
  if(!S.db) return Promise.resolve();
  pending++; setStatus();
  const run = ()=> S.db.doc(path).set(data).catch(e=>{
    if(e && e.code==="unavailable") return new Promise(r=>setTimeout(r,800+Math.random()*800)).then(()=>S.db.doc(path).set(data));
    throw e; });
  chains[path] = (chains[path]||Promise.resolve()).then(run).catch(e=>{
    toast(e && e.code==="invalid_argument" ? "You can view this Lab but not save to it. Ask Nathan for edit access." : "Couldn't save just now. Your last change may not be kept.");
  }).finally(()=>{pending--; setStatus();});
  return chains[path];
}
function getJob(id){ if(id==="example") return S.example; return S.jobs.find(j=>j.id===id); }
function putJob(job, noRender){
  job.updatedAt = Date.now();
  ensureSids(job);
  if(job.example){ S.example = job; if(!noRender) render(); return; }
  const i = S.jobs.findIndex(j=>j.id===job.id);
  if(i>=0) S.jobs[i]=job; else S.jobs.unshift(job);
  const {id, ...body} = job;
  save("jobs/"+id, JSON.parse(JSON.stringify(body)));
  if(!noRender) render();
}

/* ================= boot ================= */
async function boot(){
  render();
  S.curHash = location.hash.slice(1);
  window.addEventListener("hashchange", ()=>{ S.lastHash=S.curHash; S.curHash=location.hash.slice(1); S.addPaste=null; flushClock(true); keepTimerFor(view()); S.editing=null; closeLayer(); render(); window.scrollTo(0,0); });
  document.addEventListener("visibilitychange", ()=>{ if(document.hidden) flushClock(false); else if(S.clock) S.clock.since=Date.now(); });
  const c = window.claude;
  if(!c || !c.use){ S.local=true; S.loaded.jobs=true; setStatus(); render(); return; }
  const [db,user,sample,assets] = await Promise.all([c.use("db").catch(()=>null), c.use("user").catch(()=>null), c.use("sample").catch(()=>null), c.use("assets").catch(()=>null)]);
  S.db=db; S.user=user; S.sample=sample; S.assets=assets;
  try{ S.me = user ? await user.id() : null; }catch(e){}
  if(!db){ S.local=true; S.loaded.jobs=true; setStatus(); render(); return; }
  const timeout = setTimeout(()=>{ if(!S.loaded.jobs){ S.loaded.jobs=true; toast("Your saved work can't be reached yet. It may show up in a moment."); render(); } },10000);
  const docs = snap => snap.docs.map(d=>({id:d.id, ...clone(d.data()||{})}));
  db.collection("jobs").onSnapshot(snap=>{
    if(!snap.metadata.fromCache) clearTimeout(timeout);
    S.jobs = docs(snap).filter(j=>!j.trashedAt).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
    S.jobs.forEach(j=>ensureSids(j)); /* ids are saved the next time the plan changes */
    S.loaded.jobs=true; softRender();
  }, ()=>{ S.loaded.jobs=true; render(); });
  db.collection("projects").onSnapshot(snap=>{ S.projects = docs(snap).filter(p=>!p.trashedAt).sort((a,b)=>(a.name||"").localeCompare(b.name||"")); softRender(); }, ()=>{});
  db.collection("cards").onSnapshot(snap=>{ S.cards = docs(snap).filter(c=>!c.trashedAt).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)); migrateStars(); softRender(); }, ()=>{});
  db.collection("kits").onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>{ m[d.id]=clone(d.data()||{}); }); S.kits=m; softRender(); }, ()=>{});
  db.collection("feedback").onSnapshot(snap=>{ S.feedback=docs(snap).filter(f=>!f.trashedAt).sort((a,b)=>(b.at||0)-(a.at||0)); if(view().v==="settings") softRender(); }, ()=>{});
  db.collection("parking").onSnapshot(snap=>{ S.parking = docs(snap).sort((a,b)=>(b.at||0)-(a.at||0)); softRender(); }, ()=>{});
  db.collection("work").onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>{ m[d.id]=clone(d.data()||{}); }); S.work=m; workArrived(); }, ()=>{});
  db.collection("glossary").onSnapshot(snap=>{ S.gloss=docs(snap).filter(g=>!g.trashedAt); paintGlossPage(); paintGlossSheet(); }, ()=>{});
  if(S.me) db.doc("prefs/"+S.me).onSnapshot(s=>{ if(s.exists && !(S.prefs&&S.prefs.updatedAt>((s.data()||{}).updatedAt||0))) S.prefs=clone(s.data()); }, ()=>{});
  db.doc("lab/guide").onSnapshot(s=>{ S.guide = s.exists ? clone(s.data().tools||[]) : null; softRender(); }, ()=>{});
  db.doc("lab/playbooks").onSnapshot(s=>{ S.playbooks = s.exists ? clone(s.data().families||[]) : null; softRender(); }, ()=>{});
}

function softRender(){
  if(S.waiting){ S.waiting=false; render(); return; }
  const v=view().v; const a=document.activeElement;
  if(v==="focus"){
    const busy = (a && a!==document.body && (/INPUT|TEXTAREA|SELECT/.test(a.tagName) || a.isContentEditable)) || Object.values(wsDirty).some(Boolean) || $("#layer").innerHTML || document.getElementById("sheetWrap") || document.getElementById("ctxMenu") || document.querySelector(".lb, .ws.full") || (document.getElementById("sideWrap")||{contains:()=>false}).contains(a);
    if(!busy){ const y=window.scrollY; render(); window.scrollTo(0,y); }
    else { refreshSide(); const r=view(), j=getJob(r.id), st=j&&focusStep(j); if(st) document.querySelectorAll("[data-atts]").forEach(el=>{ if(!el.contains(a)) { el.outerHTML=stepAttachments(j,st); } }); wireAtts(document); }
    renderNav(); return; }
  const typing = a && $("#app").contains(a) && (/INPUT|TEXTAREA|SELECT/.test(a.tagName) || a.isContentEditable);
  if(["home","job","parking","projects","project","board","compare","settings","glossary"].includes(v) && !S.editing && !(v==="project" && S.projTab[view().id]==="kit") && !typing && !$("#layer").innerHTML && !document.getElementById("sheetWrap") && !document.getElementById("ctxMenu") && !document.querySelector(".lb")) render(); else renderNav();
}

/* ================= routing ================= */
function view(){
  const h = location.hash.slice(1); let m;
  if(!h || h==="home") return {v:"home"};
  if(["guide","parking","new","playbooks","projects","board","compare","settings","glossary"].includes(h)) return {v:h};
  if((m=h.match(/^project-([a-z0-9]+)$/))) return {v:"project", id:m[1]};
  if((m=h.match(/^ws-([a-z0-9]+)$/))) return {v:"project", id:m[1], tab:"workspace"};
  if((m=h.match(/^card-([a-z0-9]+)$/))) return {v:"card", id:m[1]};
  if((m=h.match(/^job-([a-z0-9]+)$/))) return {v:"job", id:m[1]};
  if((m=h.match(/^focus-([a-z0-9]+)$/))) return {v:"focus", id:m[1]};
  return {v:"home"};
}
function go(h){ if(location.hash==="#"+h) render(); else location.hash=h; }
function renderNav(){
  const v = view().v;
  document.querySelectorAll("#nav a").forEach(a=>{ const on = a.dataset.v===v || (a.dataset.v==="home" && ["home","new","job","focus"].includes(v)) || (a.dataset.v==="projects" && ["project"].includes(v)) || (a.dataset.v==="board" && ["card","compare"].includes(v)) || (a.dataset.v==="settings" && ["guide","playbooks"].includes(v));
    a.classList.toggle("on", on); if(on) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  $("#parkCount").textContent = S.parking.filter(p=>!p.done && !p.trashedAt).length;
  paintTopTimer();
}
function render(){
  S.waiting=false; closeMenu();
  renderNav();
  const r = view(), app = $("#app");
  if(r.tab && r.v==="project") S.projTab[r.id]=r.tab;
  document.body.classList.toggle("in-focus", r.v==="focus");
  if(r.v!=="focus") document.body.classList.remove("calm");
  const map = {home:homeView, new:newView, guide:guideView, parking:parkingView, playbooks:playbooksView, projects:projectsView, board:boardView, compare:compareView, settings:settingsView, glossary:glossaryView};
  parkChatHome(r.v==="focus" && S.drawerTab==="chat");
  if(r.v==="job") app.innerHTML = jobView(r.id);
  else if(r.v==="project") app.innerHTML = projectView(r.id);
  else if(r.v==="card") app.innerHTML = cardView(r.id);
  else if(r.v==="focus") app.innerHTML = focusView(r.id);
  else app.innerHTML = map[r.v]();
  wire(r);
}

/* ================= step helpers ================= */
function liveSteps(j){ return (j.steps||[]).filter(s=>!s.removed); }
function firstOpen(j){ return (j.steps||[]).find(s=>!s.removed && s.status!=="done" && s.status!=="skipped"); }
function curStep(j){
  const st=j.steps||[];
  if(j.pin!=null && st[j.pin] && !st[j.pin].removed && !st[j.pin].status) return st[j.pin];
  return firstOpen(j);
}
function sortByStage(steps){ return steps.map((s,i)=>({s,i})).sort((a,b)=>((SPINE_IDX[a.s.stage]??99)-(SPINE_IDX[b.s.stage]??99))||(a.i-b.i)).map(x=>x.s); }
function stagesOf(j){ const seen=[]; liveSteps(j).forEach(s=>{ const k=s.stage||"_"; if(!seen.includes(k)) seen.push(k); }); return seen; }

function guessFamily(t){
  t=t.toLowerCase();
  if(/\b(site|website|web|ui|ux|app|landing|homepage|dashboard|screen|portal)\b/.test(t)) return "web";
  if(/\b(logo|brand|branding|identity|rebrand|wordmark)\b/.test(t)) return "brand";
  if(/\b(package|packaging|bag|box|label|can|bottle|pouch|print|poster|flyer|menu|sticker|merch)\b/.test(t)) return "packaging";
  if(/\b(post|posts|social|instagram|campaign|ad|ads|tiktok|story|stories|reel|carousel|email)\b/.test(t)) return "social";
  return "other";
}
function guessProject(t){ t=(t||"").toLowerCase(); const p=S.projects.find(p=>t.includes((p.name||"").toLowerCase())); return p?p.id:null; }
function guessFresh(t){ return /\b(redesign|overhaul|refresh|update|rework|revamp|rebrand|improve|fix)\b/i.test(t) ? "redesign" : "new"; }

const STAGE_NOT_YET = {
  understand:["Designing anything yet","Solving the whole problem today","Perfect wording; rough notes are fine"],
  explore:["Choosing final colours or type","Making anything presentation-ready","Deciding the direction; that's the next phase"],
  direction:["Detailed layouts or every page","Final copy","Pixel-level spacing"],
  rough:["Colour and final fonts","Image selection and retouching","Alignment and micro-spacing"],
  build:["Micro-spacing and tiny details; Polish handles those","Second-guessing the chosen direction","Extra variations nobody asked for"],
  critique:["Redesigning from scratch","Fixing everything at once; just list the fixes"],

  deliver:["Last-minute redesigns","Polishing beyond what's agreed"]
};
const LATER_PHASE = {understand:"Explore and Direction", explore:"Direction", direction:"Rough and Build", rough:"Build", build:"Polish", critique:"Polish", polish:"the next version", deliver:"the next project"};
function geItems(text){ return String(text||"").split(/\n|;|\s+•\s+/).map(x=>x.trim().replace(/^[-•*]\s*/,"").replace(/\.$/,"")).filter(Boolean); }
function todoHtml(text){
  const t=String(text||"").trim(); if(!t) return "";
  const lines=t.split(/\n+/).map(x=>x.trim()).filter(Boolean);
  const listy = lines.filter(l=>/^(\d+[.)]|[-•*])\s+/.test(l)).length;
  if(lines.length>1 && listy>=lines.length-1) return `<ol>${lines.map(l=>`<li>${esc(l.replace(/^(\d+[.)]|[-•*])\s+/,""))}</li>`).join("")}</ol>`;
  if(lines.length>1) return lines.map(l=>`<p>${esc(l)}</p>`).join("");
  const sents = t.split(/(?<=[.!?])\s+(?=[A-Z])/).filter(Boolean);
  if(sents.length>=3) return `<ol>${sents.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`;
  return `<p>${esc(t)}</p>`;
}

function toolResults(){
  const t={};
  S.jobs.forEach(j=>(j.steps||[]).forEach(s=>{ const r=s.toolResult; if(!r||!s.tool||s.tool==="None") return;
    const x=t[s.tool]=t[s.tool]||{great:0,ok:0,missed:0,better:{}}; x[r.rating]=(x[r.rating]||0)+1; if(r.better) x.better[r.better]=(x.better[r.better]||0)+1; }));
  return t;
}
function toolResultsText(){
  const t=toolResults(); const names=Object.keys(t); if(!names.length) return "None yet.";

}

    <div class="row" style="gap:10px"><div class="seg2" role="group" aria-label="Show">${[["open","Open"],["done","Done"],["all","All"]].map(([k,l])=>`<button class="${f.status===k?"on":""}" data-pkst="${k}">${l}</button>`).join("")}</div>
      <select id="parkProjF" style="width:auto" aria-label="Filter by project"><option value="">All projects</option>${S.projects.map(p=>`<option value="${p.id}" ${f.project===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}<option value="__none" ${f.project==="__none"?"selected":""}>Not in a project</option></select></div>
    ${keys.length?keys.map(k=>`<details class="pgroup" data-pg="${esc(k||"none")}" ${collapsed[k||"none"]?"":"open"}><summary>${k?monogram(projById(k)||{name:"?"},"sm"):`<div class="mono sm" style="background:var(--soft);color:var(--muted)">·</div>`}<h3 style="flex:1">${k?esc(projName(k)):"Not in a project"}</h3><span class="meta">${groups.get(k).length}</span></summary><div class="plist">${groups.get(k).map(row).join("")}</div></details>`).join("")

/* ================= wiring ================= */
function wire(r){
  const app = $("#app");
  app.onclick = e=>{
    const t=e.target;
    const jm=t.closest("[data-jobmenu]"); if(jm){ e.stopPropagation(); jobMenu(jm, getJob(jm.dataset.jobmenu)); return; }
    const pm=t.closest("[data-projmenu]"); if(pm){ e.stopPropagation(); projMenu(pm, projById(pm.dataset.projmenu)); return; }
    const plm=t.closest("[data-planmenu]"); if(plm){ e.stopPropagation(); planMenu(plm, getJob(plm.dataset.planmenu)); return; }
    const tm=t.closest("[data-taskmenu]"); if(tm){ e.stopPropagation(); taskMenu(tm, getJob(r.id), +tm.dataset.taskmenu); return; }
    const cm=t.closest("[data-cardmenu]"); if(cm){ e.stopPropagation(); cardMenu(cm, S.cards.find(c=>c.id===cm.dataset.cardmenu)); return; }
    const dm=t.closest("[data-docmenu]"); if(dm){ e.stopPropagation(); cardMenu(dm, S.cards.find(c=>c.id===dm.dataset.docmenu), true); return; }
    const pkm=t.closest("[data-parkmenu]"); if(pkm){ e.stopPropagation(); parkMenu(pkm, S.parking.find(p=>p.id===pkm.dataset.parkmenu)); return; }
    const ct=t.closest("[data-cmpt]"); if(ct){ const id=ct.dataset.cmpt; if(S.compare.includes(id)) S.compare=S.compare.filter(x=>x!==id); else { if(S.compare.length>=4){ toast("Compare holds 4 at a time."); return; } S.compare.push(id); } S.compareBack=location.hash.slice(1); render(); return; }
    const pst=t.closest("[data-pkst]"); if(pst){ S.parkFilter.status=pst.dataset.pkst; render(); return; }
    const wm=t.closest("[data-wsmode]"); if(wm){ S.wsView[r.id].mode=wm.dataset.wsmode; render(); return; }
    const fl=t.closest("[data-fill]"); if(fl){ const j=getJob(r.id); fillPlaceholder(j, focusStep(j), fl.dataset.fill); return; }
    const gc=t.closest("[data-gec]"); if(gc){ const j=getJob(r.id), s=focusStep(j); s.geChecks=s.geChecks||[]; s.geChecks[+gc.dataset.gec]=gc.checked; putJob(j,true); return; }
    if(t.closest("[data-stop]") && t.closest("a,button")) return;
    const pr=t.closest("[data-proj]"); if(pr && !t.closest("button,a,input")){ go("project-"+pr.dataset.proj); return; }
    const open = t.closest("[data-open]"); if(open && !t.closest("button,a,input,select")){ go("job-"+open.dataset.open); return; }
    const b = t.closest("[data-act]"); if(!b) return;
    act(b.dataset.act, b, r);
  };
  app.onkeydown = e=>{ if(e.key==="Enter" && !isTyping(e)){ const open=e.target.closest("[data-open]"); if(open && e.target===open) go("job-"+open.dataset.open); const pr=e.target.closest("[data-proj]"); if(pr && e.target===pr) go("project-"+pr.dataset.proj); } };
  const sf = $("#startForm"); if(sf) sf.onsubmit = e=>{ e.preventDefault(); const v=$("#taskInput").value.trim(); if(!v){ $("#taskInput").focus(); return; } draftTask=v; go("new"); };
  const ti = $("#taskInput"); if(ti) ti.oninput = ()=>{ draftTask = ti.value; };
  const inf = $("#intakeForm"); if(inf) inf.onsubmit = e=>{ e.preventDefault(); startPlan(); };
  const ft = $("#f-title"); if(ft) ft.onchange = ()=>{ $("#f-family").value = guessFamily(ft.value); const gp=guessProject(ft.value); if(gp) $("#f-proj").value=gp; };
  const fp = $("#f-proj"); if(fp) fp.onchange = ()=>{ $("#f-projnew").style.display = fp.value==="__new"?"block":"none"; };
  const wf = $("#wrapForm"); if(wf) wf.onsubmit = e=>{ e.preventDefault(); const j=getJob(r.id); j.wrap={slow:$("#w-slow").value.trim(), ai:$("#w-ai").value.trim()}; j.status="done"; putJob(j); toast("Plan finished."); go("home"); };
  wireWall(r); wireWall2(r); wireKit(r);
  wireWs(app); wireAtts(app);
  if(r.v==="focus") wireSide(r);
  document.querySelectorAll("details.phase").forEach(d=>d.addEventListener("toggle", ()=>{ const st=lsGet("phases:"+r.id,{})||{}; st[d.dataset.phase]=d.open; lsSet("phases:"+r.id, st); }));
  document.querySelectorAll("details[data-ctx]").forEach(d=>d.addEventListener("toggle", ()=>lsSet("ctxOpen", d.open)));
  document.querySelectorAll("details.pgroup").forEach(d=>d.addEventListener("toggle", ()=>{ const st=lsGet("parkCollapsed",{}); st[d.dataset.pg]=!d.open; lsSet("parkCollapsed", st); }));
  document.querySelectorAll("[data-wsf]").forEach(sel=>sel.onchange=()=>{ S.wsView[r.id][sel.dataset.wsf]=sel.value; render(); });
  const ppf=$("#parkProjF"); if(ppf) ppf.onchange=()=>{ S.parkFilter.project=ppf.value; render(); };
  const pi = $("#parkInline"); if(pi) pi.onsubmit = e=>{ e.preventDefault(); const v=$("#parkInlineInput").value.trim(); if(v){ addPark(v,null,false,{projectId:$("#parkInlineProj").value||null}); $("#parkInlineInput").value=""; } };
  if(r.v==="glossary") wireGloss($("#glossPage"), S.glossSt, "gp", paintGlossPage);
}

function act(a, b, r){

/* ================= gates, jumping, finishing ================= */
function jumpTo(j, i, ahead){
  const target=j.steps[i], cur=firstOpen(j);
  const doIt=()=>{ delete S.peekSid[j.id]; j.pin=i; putJob(j, true); go("focus-"+j.id); };
  if(!ahead){ doIt(); return; }
  const left = liveSteps(j).filter(s=>!s.status && (SPINE_IDX[s.stage]??0) < (SPINE_IDX[target.stage]??0)).length;
  const polish = target.stage==="polish";
  modal(`<h2>Not yet?</h2>
    <p>You're in <b>${stageName(cur.stage)}</b>. “${esc(target.title)}” is in <b>${stageName(target.stage)}</b>, with ${left} step${left===1?"":"s"} before it.</p>
    <p class="muted">${polish?"Fine details belong in Polish, after the design is set. Polishing now is how a day disappears.":"Jumping ahead is how time goes to things that don't move the needle yet."}</p>
    <div class="row"><button class="btn primary" id="mStay">Stay on track</button><button class="btn ghost" id="mGo">Do it anyway</button></div>`,
    {mStay:closeLayer, mGo:()=>{ closeLayer(); doIt(); }});
}
function finishStep(j, how){
  const s=curStep(j); if(!s) return;
  flushWork(); flushClock(false); stopTimerFor(j, s);
  if(j.projectId && s.tag!=="you"){ const blk=decisionBlock(j,s); const filled=fillPrompt(j,s); s.usedDecisions=[...new Set([...blk.list.map(d=>d.id), ...filled.used.filter(u=>u.dec).map(u=>u.dec.id)])]; }
  else if(j.projectId){ s.usedDecisions=decisionsOf(j.projectId).filter(d=>d.status==="confirmed").map(d=>d.id); }
  const next = ()=>{
    s.status=how; s.finishedAt=Date.now(); s.resumeNote=null;
    if(j.pin!=null && j.steps[j.pin]===s) j.pin=null;
    if(how==="done") proposeDecisions(j, s);
    const nx = curStep(j);
    const leavingStage = how==="done" && s.stage && j.family && (!nx || nx.stage!==s.stage) && !liveSteps(j).some(x=>x.stage===s.stage && !x.status);
    if(leavingStage){
      const bar=stageBar(j,s.stage);
      const kitQ = s.stage==="direction" && j.projectId ? kitOf(j.projectId) : null;
      const offerLock = s.stage==="direction" && j.projectId && kitReady(kitQ) && kitQ.status!=="locked";
      const noKit = s.stage==="direction" && j.projectId && !kitReady(kitQ);
      putJob(j, true);
      modal(`<span class="eyebrow">Finishing ${stageName(s.stage)}</span><h2>Does ${stageName(s.stage)} meet its bar?</h2>
        <div class="goodenough"><b>Good enough:</b> ${esc(bar)}</div>
        ${offerLock?`<p>Locking the kit now means every prompt from here on matches this direction.</p>`:noKit?`<p class="muted">There's no kit yet. Drafting one now keeps every later prompt on this direction.</p>`:`<p class="muted">Good enough is the goal. Anything more belongs in Polish.</p>`}
        <div class="row">${offerLock?`<button class="btn primary" id="gLock">Yes, and lock the kit</button>`:""}<button class="btn ${offerLock?"":"primary"}" id="gYes">Yes, on to ${nx&&nx.stage?stageName(nx.stage):"the finish"}</button>${noKit?`<button class="btn" id="gKit">Draft the kit first</button>`:""}<button class="btn ghost" id="gNo">Not yet</button></div>`,
        {gLock:()=>{ const k=clone(kitQ); k.status="locked"; k.lockedAt=Date.now(); putKit(j.projectId,k); closeLayer(); putJob(j); toast("Direction done. Kit locked."); window.scrollTo(0,0); },
         gKit:()=>{ closeLayer(); delete s.status; delete s.finishedAt; S.drawerTab="kit"; putJob(j, true); draftKit(j.projectId); },
         gYes:()=>{ closeLayer(); putJob(j); toast(stageName(s.stage)+" done."); window.scrollTo(0,0); },
         gNo:()=>{ closeLayer(); const k=j.steps.indexOf(s); j.steps.splice(k+1,0,{sid:uid(), title:"Close the gap in "+stageName(s.stage), stage:s.stage, tag:"you", tool:s.tool, minutes:15, fidelity:s.fidelity, goodEnough:bar, why:"Only what's missing for the bar. Nothing extra.", prompt:"Write down the one thing missing for the bar, and do only that."}); putJob(j); toast("Added a 15-minute step to close the gap."); }});
      return;
    }
    putJob(j); if(how==="done") toast("Saved and done. On to the next step."); else toast("Skipped. You can come back to it from the full plan."); window.scrollTo(0,0);
  };
  if(how==="done" && s.tag!=="you" && s.tool && s.tool!=="None" && !s.toolResult) askToolResult(s, next); else next();
}
function askToolResult(s, then){
  const others = guide().filter(t=>t.name!==s.tool).map(t=>t.name);
  let rating=null;
  modal(`<h2>How did ${esc(s.tool)} do?</h2><p class="muted" style="font-size:14px">One tap. Over time this tells you which tool to trust for what.</p>
    <div class="rate"><button class="btn" data-r="great">Nailed it</button><button class="btn" data-r="ok">Okay</button><button class="btn" data-r="missed">Missed</button></div>
    <div><label for="rBetter">A better tool would have been <span class="hint">optional</span></label><select id="rBetter"><option value="">No, this was the right tool</option>${others.map(n=>`<option>${esc(n)}</option>`).join("")}</select></div>
    <div class="row"><button class="btn primary" id="rSave">Save</button><button class="btn ghost" id="rSkip">Skip</button></div>`,
    {rSave:()=>{ if(rating) s.toolResult={rating, better:$("#rBetter").value||null}; closeLayer(); then(); }, rSkip:()=>{ closeLayer(); then(); }});
  document.querySelectorAll("[data-r]").forEach(bt=>bt.onclick=()=>{ rating=bt.dataset.r; document.querySelectorAll("[data-r]").forEach(x=>x.classList.toggle("on",x===bt)); });
}
/* Previous shows the earlier step without changing whether it's done */
function prevStep(j){
  flushWork();
  const live=liveSteps(j); const s=focusStep(j); const pos = s ? live.indexOf(s) : live.length;
  if(pos<=0) return;
  const target=live[pos-1];
  if(target===curStep(j)) delete S.peekSid[j.id]; else S.peekSid[j.id]=target.sid;
  render(); window.scrollTo(0,0);
}

/* ================= time tracking ================= */
function startClock(j, s){
  const key = j.id+":"+j.steps.indexOf(s);
  if(S.clock && S.clock.key===key) return;
  flushClock(false);
  S.clock = {key, job:j, step:s, since:Date.now()};
}
function flushClock(saveIt){
  const c=S.clock; if(!c) return;
  if(!document.hidden){ const sec=Math.min(7200, Math.round((Date.now()-c.since)/1000)); c.step.spentSec=(c.step.spentSec||0)+sec; }
  c.since=Date.now();
  if(saveIt){ const j=c.job; S.clock=null; if(!j.example && (c.step.spentSec||0)>0) putJob(j, true); }
}

/* where she was, so Today can bring her straight back */
function setPlace(j, s){ const lp=prefs().lastPlace; if(lp && lp.jobId===j.id && lp.sid===s.sid && Date.now()-(lp.at||0)<60000) return; setPref("lastPlace", {jobId:j.id, sid:s.sid, at:Date.now()}); }
/* estimate vs actual, without turning it into a score */
function timeInsight(j, open){
  const live=liveSteps(j); const rows=stagesOf(j).map(k=>{ const st=live.filter(s=>(s.stage||"_")===k); return {k, plan:st.reduce((a,s)=>a+(+s.minutes||0),0), act:Math.round(st.reduce((a,s)=>a+(s.spentSec||0),0)/60), done:st.every(s=>s.status)}; });
  if(!rows.some(r=>r.act>0)) return "";
  const finished=rows.filter(r=>r.done && r.act>0); const ratio = finished.length ? finished.reduce((a,r)=>a+r.act,0)/Math.max(1,finished.reduce((a,r)=>a+r.plan,0)) : 0;
  const tip = ratio>1.25 ? `Finished phases took about ${Math.round(ratio*10)/10}× the estimate. That's useful to know: next time the Lab can plan more time for this kind of work.` : ratio && ratio<0.8 ? "You're finishing phases faster than estimated. Future plans can be tighter." : ratio ? "Your estimates are landing close. Nice and predictable." : "";
  return `<details class="card" ${open?"open":""}><summary style="cursor:pointer;font-weight:700">Time: planned and actual</summary>

}

/* ================= planning ================= */
function guideText(){ return guide().map(t=>`- ${t.name} (${t.kind==="hands"?"her own hands":"AI tool"}): use for ${t.goodFor}.${t.avoidFor?" Not for: "+t.avoidFor+".":""}`).join("\n"); }
function playbookText(f, fresh){
  return SPINE.map(s=>{ const st=f.stages[s.key]||{}; return `Stage "${s.key}" (${s.name}): ${st.goal||""}. Good enough: ${st.bar||""}. Typical steps: ${(st.steps||"").split("\n").filter(Boolean).filter(x=>fresh==="redesign"||!/^redesign:|^rebrand:/i.test(x)).map(x=>x.replace(/^(redesign|rebrand):\s*/i,"")).join("; ")}`; }).join("\n");
}
function planPrompt(intake){
  const f = family(intake.family);
  return `You plan design work for Jenna, a senior graphic designer with ten years of experience who runs her own studio. In her words: her process is often all over the place, she jumps ahead (straight to high-fidelity mockups and micro-spacing before inspiration and direction are set), she gets sidetracked, she overuses Claude where another tool would do better, she wants senior-level work that does not look AI-generated, and perfectionism stalls her even when the work is good.

Build her a plan she follows one step at a time.

The spine. Every step belongs to one stage, and stages run in this order: understand, explore, direction, rough, build, critique, polish, deliver.
- Never put spacing, fine detail or refinement work before the polish stage. Never start high fidelity before the rough stage is done.
- The explore stage includes one timed "free exploration" step (tag "you", fidelity "rough", 20 to 30 minutes).
- The critique stage has exactly one step: one critique round measured against her must-haves. If they pass, it ships.
- Polish steps together must fit the polish budget of ${f.polishBudget} minutes.

This task's playbook: ${f.name} (${intake.fresh==="redesign"?"reworking something that already exists":"starting fresh"}).
${playbookText(f, intake.fresh)}
Use the typical steps as a starting point, then fit them to this job and client. Add steps the job needs (for example a claims or compliance check for a regulated industry, or printer specs for packaging) and drop ones it doesn't.

Rules for each step:
- For a whole project, 8 to 14 steps. For a single piece, 5 to 8 steps.
- Each step is one sitting of 5 to 90 minutes. The first step must be something she can start in under 2 minutes.
- tag: "you" for taste, judgment, client calls and all final visual design; "ai" when a tool can do the whole step and she only checks it; "together" when AI drafts and she edits.
- AI does research, organizing, references and first drafts of words. Final visuals are always "you" steps in her hands tools. AI images are references and moodboards only.
- tool: exactly one name from the tool guide, or "None". Do not default to Claude: pick the tool whose strengths fit the step. When the order allows, put steps that use the same tool back to back.
- fidelity: "rough", "mid" or "final".
- goodEnough: a concrete bar for this step that tells her when to stop, for example "gray boxes, real headings, no colour, no fonts".
- prompt: for "ai" and "together" steps, a complete prompt she can paste as-is with all the context it needs (audience, goal, must-haves, tone, format, length), asking for a specific, checkable format. Use only facts from the task; put unknowns in [BRACKETS]. For "you" steps, one or two plain lines telling her what to do.
- check: for "ai" and "together" steps, 2 or 3 short things to check before accepting the result.
- why: one short line on why this step comes here and why this tool.
- title: short and actionable, 2 to 6 words (e.g. "Thumbnail sketch exploration", "Explore and select a concept"). Put deliverables, counts and constraints in prompt and goodEnough, not in the title.
- goodEnough: specific and measurable, as 2 to 4 short criteria separated by semicolons (e.g. "5 to 8 references saved; 3 qualities named; one initial direction written down"). Polish steps must say the polish budget of ${f.polishBudget} minutes, never a different number.
- notYet: 2 or 3 concrete things NOT to worry about yet in this step, tailored to it (e.g. for a moodboard: "final colours", "perfect type choices", "making it presentation-ready").
- Plain, warm, short sentences. No hype.

${S.pendingProject && kitReady(kitOf(S.pendingProject)) ? "This project's kit (design system). Fit the steps to it. Do not paste it into prompts; the Lab attaches it automatically:\n"+kitText(S.pendingProject,"Claude")+"\n\n" : ""}Her own tool results so far:
${toolResultsText()}

Tool guide:
${guideText()}

Task: ${intake.title}
Must-haves: ${intake.musts||"not given"}
Due: ${intake.deadline||"not given"}
Already has: ${intake.have||"not given"}
Done looks like: ${intake.done||"not given"}
Time today: ${intake.today||"not given"}
About this client: ${intake.notes||"nothing given"}
Client brief: ${((projById(S.pendingProject)||{}).brief||"not given").slice(0,12000)}

Reply with only JSON in this shape:
{"title":"2 to 5 word plan name that tells it apart from other plans, e.g. \"Brain Bird logo + kit\"","summary":"one sentence on the approach","steps":[{"stage":"understand","title":"","tag":"you","tool":"None","minutes":15,"fidelity":"rough","goodEnough":"","notYet":[],"why":"","prompt":"","check":[]}]}`;
}
function normalizePlan(p, intake){
  if(!p || !Array.isArray(p.steps) || !p.steps.length) return null;
  const names = guide().map(t=>t.name.toLowerCase());
  const f = family(intake.family);
  let steps = p.steps.slice(0,18).map(s=>{
    const tag=["you","ai","together"].includes(s.tag)?s.tag:"you";
    let tool=String(s.tool||"None"); const ti=names.indexOf(tool.toLowerCase()); tool = ti>=0 ? guide()[ti].name : "None";
    const stage = SPINE_IDX[s.stage]!=null ? s.stage : "build";
    let goodEnough=String(s.goodEnough||"");
    if(stage==="polish" && f) goodEnough=goodEnough.replace(/\b\d+\s*(min|minutes)\b/gi, f.polishBudget+" minutes");
    return {sid:uid(), stage, title:String(s.title||"Step").slice(0,90), tag, tool, minutes:Math.max(1,Math.min(240,parseInt(s.minutes,10)||15)),
      fidelity:FID[s.fidelity]?s.fidelity:"mid", goodEnough, why:String(s.why||""), prompt:String(s.prompt||""),
      notYet:(Array.isArray(s.notYet)?s.notYet:[]).map(String).filter(Boolean).slice(0,5),
      check:(Array.isArray(s.check)?s.check:[]).map(String).filter(Boolean).slice(0,4)}; });
  if(!steps.some(s=>s.stage==="critique")) steps.push({sid:uid(), stage:"critique", title:"Critique against the must-haves", tag:"together", tool:toolByName("Claude")?"Claude":"None", minutes:15, fidelity:"final", goodEnough:(f.stages.critique||{}).bar||"Checked once against the must-haves", why:"One round against the brief instead of endless second-guessing.", prompt:`Here are screenshots of my design. Must-haves: ${intake.musts||"[MUST-HAVES]"}. For each must-have, say pass or fail and why. Then list at most 5 fixes, most important first. Do not suggest a new direction.`, check:["Every must-have got a pass or fail"], notYet:["Redesigning from scratch"]});
  steps = sortByStage(steps); /* the spine is enforced here, whatever came back */
  return {title:String(p.title||"").slice(0,60), summary:String(p.summary||"").slice(0,400), steps};
}
function parsePlan(raw, intake){ try{ const a=raw.indexOf("{"), b=raw.lastIndexOf("}"); if(a<0||b<a) return null; return normalizePlan(JSON.parse(raw.slice(a,b+1)), intake); }catch(e){ return null; } }

/* Timer state lives in S.timer and in this browser's storage, so it survives moving around the Lab and reloads.
   {jobId, sid, title, total (sec), acc (sec run before), runAt (ms while running, else null), expired} */
function timerElapsed(){ const t=S.timer; if(!t) return 0; return t.acc + (t.runAt? (Date.now()-t.runAt)/1000 : 0); }
function timerLeft(){ return S.timer ? Math.round(S.timer.total - timerElapsed()) : 0; }
function fmtLeft(sec){ const neg=sec<0; sec=Math.abs(Math.round(sec)); return `${neg?"-":""}${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`; }
function persistTimer(){ lsSet("timer", S.timer||null); }
function timerWidget(j, s){
  const t = S.timer;
  const mine = t && t.jobId===j.id && t.sid===s.sid;
  if(t && !mine) return `<a class="tmr" href="#focus-${esc(t.jobId)}" title="Timer running on another step"><span class="lbl">Timer on “${esc((t.title||"").slice(0,24))}”</span><span class="clock tclock" style="font-size:15px">${fmtLeft(timerLeft())}</span></a>`;
  if(!mine) return `<div class="tmr" data-tw><button class="icon-btn" data-act="timerStart" aria-label="Start ${+s.minutes||25} minute timer">▶</button><span class="clock" style="font-size:16px">${+s.minutes||25}:00</span><span class="lbl">estimate</span></div>`;

/* ---------- image handling: preview on the card, full file in storage ---------- */
async function drawTo(file, max){
  const bmp = await createImageBitmap(file);
  const sc = Math.min(1, max/Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width=Math.max(1,Math.round(bmp.width*sc)); c.height=Math.max(1,Math.round(bmp.height*sc));
  const ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(bmp,0,0,c.width,c.height);
  return {canvas:c, w:bmp.width, h:bmp.height};
}
function toBlob(canvas, type, q){ return new Promise(r=>canvas.toBlob(r, type, q)); }
async function makeThumb(file){
  try{ const {canvas,w,h}=await drawTo(file, 520); let q=.74, d=canvas.toDataURL("image/jpeg",q); while(d.length>110000 && q>.35){ q-=.12; d=canvas.toDataURL("image/jpeg",q); } return {thumb:d,w,h}; }
  catch(e){ return {thumb:"",w:0,h:0}; }
}
async function storeFile(file, ftype){
  if(!S.assets){ if(S.local){ const id="local"+uid(); S.localBlobs[id]=URL.createObjectURL(file); return {id}; } return {id:null, reason:"no-access"}; }
  const tryUp = (f,t) => S.assets.upload(f, t?{type:t}:undefined).then(r=>({id:r.id, url:r.url}));
  try{ return await tryUp(file, ftype||fileType(file)); }
  catch(e){
    if(e && (e.code==="rate_limited"||e.code==="quota_or_state"||e.code==="upstream_auth")) return {id:null, reason:e.code};
    if(!/^image\/(png|jpeg|webp|gif)$/.test(file.type)) return {id:null, reason:e&&e.code};
    try{ /* the upload scan refused it, or it's too big: send a clean, browser-redrawn copy */
      const {canvas,w,h}=await drawTo(file, e&&e.code==="too_large"?3200:4096);
      const big = w*h>6e6; const blob = await toBlob(canvas, big?"image/jpeg":"image/png", .9);
      const r = await tryUp(blob); return {...r, clean:true};
    }catch(e2){ return {id:null, reason:(e2&&e2.code)||"refused"}; }
  }
}
const DOC_TYPES = {pdf:"application/pdf", docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document", doc:"application/msword", txt:"text/plain", md:"text/markdown", markdown:"text/markdown"};
function fileType(f){ if(/^image\/(png|jpeg|gif|webp)$/.test(f.type) || Object.values(DOC_TYPES).includes(f.type)) return f.type; const ext=(f.name||"").split(".").pop().toLowerCase(); return DOC_TYPES[ext] || (/^image\//.test(f.type)?f.type:""); }
const FILE_ACCEPT = "image/*,.pdf,.doc,.docx,.txt,.md";

    <div class="page-head"><span class="eyebrow">Clients and their work</span><h1>Projects</h1>
    <p class="support">A project holds its plans, brief, inspiration, kit and everything you make along the way.</p></div>

    ${S.projects.length?`<div class="jobs">${S.projects.map(p=>{ const cs=cardsOf(p.id), js=S.jobs.filter(j=>j.projectId===p.id);
      return `<div class="card job" data-proj="${p.id}" tabindex="0" role="link" aria-label="${esc(p.name)}" style="padding:0;overflow:hidden">
